var COHORT_SECTION={id:'cohort',nav:'Cohort studies',title:'Cohort studies: sizing a study that has to wait',html:
`<p>A cohort study samples on exposure and waits. That single structural fact — that you are buying <em>time</em> as well as people — changes almost everything about how the sample size is argued.</p>
<p>In a case–control study the cases already exist. In a cohort study you must generate them, and generating them costs follow-up. The design question is therefore never simply "how many people?" It is always "how many people, followed for how long, yielding how many events?"</p>

<h3>The types, and what each one changes</h3>
<table>
<tr><th>Type</th><th>What it is</th><th>What changes in the sizing</th></tr>
<tr class="hl"><td><b>Prospective (concurrent)</b></td><td>Assemble now, measure exposure now, follow forward</td><td>The default. You control measurement quality; you pay in calendar time</td></tr>
<tr><td><b>Retrospective (historical)</b></td><td>Exposure already recorded in the past; outcomes already accrued</td><td>Follow-up is free but fixed. The binding question becomes: does the existing record contain enough events? Back-solve for power</td></tr>
<tr><td><b>Ambidirectional</b></td><td>Historical exposure, continuing follow-up forward</td><td>Two accrual phases; compute expected events separately for each</td></tr>
<tr><td><b>Fixed cohort</b></td><td>Closed membership, everyone enters at once</td><td>Cumulative incidence sizing works. Everyone has the same follow-up</td></tr>
<tr><td><b>Open / dynamic cohort</b></td><td>People enter and leave over time</td><td><b>Cumulative incidence sizing is wrong.</b> Work in person-time and rates</td></tr>
<tr><td><b>Multi-outcome cohort</b></td><td>One assembled population, many outcomes studied</td><td>Size for the outcome you most need to detect, then state the power for the others honestly rather than pretending the study was powered for all of them</td></tr>
<tr><td><b>Cohort for prediction</b></td><td>The goal is a risk model, not an association</td><td>None of these formulae apply. Use the Riley approach and pmsampsize</td></tr>
</table>

<h3>The four ways to size a cohort, and how to choose</h3>
<p>Which you use depends on what you can actually specify, which in turn depends on the design.</p>
<table>
<tr><th>Route</th><th>Use when</th><th>You must supply</th></tr>
<tr><td><b>1. Two cumulative incidences</b></td><td>Fixed cohort, equal and complete follow-up</td><td>Risk in unexposed, risk ratio, allocation</td></tr>
<tr><td><b>2. Two rates (person-time)</b></td><td>Open cohort, or follow-up varies</td><td>Rate in unexposed, rate ratio, average follow-up</td></tr>
<tr><td><b>3. Number of events</b></td><td>Time-to-event outcome analysed by Cox or log-rank</td><td>Hazard ratio, allocation, expected event probability</td></tr>
<tr><td><b>4. Events per variable</b></td><td>The primary analysis is a multivariable model</td><td>Number of covariates. This is a <em>floor</em>, not a substitute for routes 1–3</td></tr>
</table>

<div class="plainbox">
<p><b>The mental model that keeps you out of trouble:</b> a cohort study's power lives in the <b>events</b>, not the participants. Ten thousand people with twelve outcomes between them is a weaker study than four hundred people with sixty. When you present a cohort sample size, present the expected number of events beside the headcount. If a protocol only gives you a headcount, the number of events has not been thought about.</p>
</div>

<h3>Route 1 — cumulative incidence</h3>
<p>Mechanically this is the two-proportion comparison you already know, with p₀ the risk in the unexposed over the whole follow-up period and p₁ = RR × p₀.</p>
<div class="eq"><div class="lbl">Exposed group, k unexposed per exposed</div>
${V('n')}<sub>exp</sub> = ${FR('['+zA+' '+SQ('(1+1/'+V('k')+')'+V('p&#772;')+'(1&minus;'+V('p&#772;')+')')+' + '+zB+' '+SQ(V('p')+'<sub>1</sub>(1&minus;'+V('p')+'<sub>1</sub>) + '+V('p')+'<sub>0</sub>(1&minus;'+V('p')+'<sub>0</sub>)/'+V('k'))+']<sup>2</sup>','('+V('p')+'<sub>1</sub> &minus; '+V('p')+'<sub>0</sub>)<sup>2</sup>')}</div>
<p>Two cohort-specific warnings that do not arise in a trial.</p>
<ul>
<li><b>Exposure prevalence is usually the binding constraint, not the formula.</b> If the calculation says you need 219 exposed people and only 15% of your source population is exposed, you must screen roughly 1,460 to get them — and you will be sitting on 1,241 unexposed people when you only needed 219. Recruit at a higher ratio, or accept the cost.</li>
<li><b>Loss to follow-up is not attrition.</b> Inflating by 1/(1 − loss) protects your power and does nothing whatever about the near-certainty that people lost differ from those retained. Budget for tracing; plan a sensitivity analysis; report completeness in person-time as Clark and colleagues recommend, not as a headcount percentage.</li>
</ul>

<div class="calc" id="c-coh">
<h4>Cohort sizing — cumulative incidence, with the screening reality</h4>
<div class="row">
<div class="fieldc"><label>Risk in unexposed p₀</label><input type="number" id="ch_p0" value="0.10" step="0.01" min="0.0001" max="0.99"></div>
<div class="fieldc"><label>Risk ratio to detect</label><input type="number" id="ch_rr" value="2.0" step="0.1" min="0.01"></div>
<div class="fieldc"><label>Unexposed per exposed (k)</label><input type="number" id="ch_k" value="1" step="1" min="0.1" max="20"></div>
<div class="fieldc"><label>Exposure prevalence in source</label><input type="number" id="ch_pe" value="0.15" step="0.05" min="0.01" max="0.99"></div>
<div class="fieldc"><label>Loss to follow-up</label><input type="number" id="ch_l" value="0.15" step="0.05" min="0" max="0.8"></div>
<div class="fieldc"><label>Power</label><select id="ch_pw"><option value="0.80">80%</option><option value="0.90">90%</option></select></div>
</div>
<div class="out" id="ch_out"></div>
</div>

<h3>Route 2 — person-time, and why the open cohort demands it</h3>
<p>People enter late, die of something else, emigrate, or are censored at the end of the study. Counting heads treats a person followed for two months as equal to one followed for nine years. Person-time does not.</p>
<div class="eq"><div class="lbl">Person-time required, log rate ratio scale</div>
${V('T')}<sub>0</sub> = ${FR('('+zA+' + '+zB+')<sup>2</sup> (1/'+V('&lambda;')+'<sub>0</sub> + 1/'+V('k&lambda;')+'<sub>1</sub>)','[ln('+V('&lambda;')+'<sub>1</sub>/'+V('&lambda;')+'<sub>0</sub>)]<sup>2</sup>')}
<div style="margin-top:.5rem;font-size:.9rem;color:var(--ink2)">then participants = person-years ÷ average years of follow-up each</div></div>
<div class="plainbox"><p>The output is <b>person-years, and turning them into participants is a separate design decision that the formula refuses to make for you.</b> Four thousand person-years is 2,000 people for two years or 800 people for five. Those two studies cost different amounts, lose different fractions to follow-up, and are exposed to different amounts of secular change in the outcome. Decide deliberately.</p></div>

<div class="calc" id="c-cohpt">
<h4>Cohort sizing — person-time, and the duration trade-off</h4>
<div class="row">
<div class="fieldc"><label>Rate in unexposed, per person-year</label><input type="number" id="pt_l0" value="0.02" step="0.005" min="0.000001"></div>
<div class="fieldc"><label>Rate ratio to detect</label><input type="number" id="pt_rr" value="1.8" step="0.1" min="0.01"></div>
<div class="fieldc"><label>Unexposed per exposed</label><input type="number" id="pt_k" value="1" step="1" min="0.1" max="20"></div>
<div class="fieldc"><label>Power</label><select id="pt_pw"><option value="0.80">80%</option><option value="0.90">90%</option></select></div>
</div>
<div class="out" id="pt_out"></div>
</div>

<h3>Route 4 — the events-per-variable floor</h3>
<p>If the analysis is a multivariable model — and in a cohort it nearly always is — the number of events limits how many covariates you can honestly adjust for. Peduzzi and colleagues' simulations gave the rule of roughly ten events per variable; Vittinghoff and McCulloch later showed it is conservative in many settings. Treat it as a floor to check, not a target to aim at.</p>
<div class="note bad"><b>This is where cohort protocols quietly fail.</b> A study powered to detect a risk ratio of 2 for one exposure may need 66 events. Its analysis plan then lists twelve confounders. Twelve variables at ten events each demands 120 events. The study is adequately powered for the crude comparison and underpowered for the adjusted one that will actually be reported. Check both.</p></div>

<h3>Cohort-specific pitfalls</h3>
<table>
<tr><th>Pitfall</th><th>What happens</th><th>Can sample size fix it?</th></tr>
<tr><td><b>Healthy-worker effect</b></td><td>The exposed are employed and therefore healthier than the general population you used as comparison</td><td>No. Use an internal unexposed comparison group from the same workforce</td></tr>
<tr><td><b>Immortal time bias</b></td><td>Person-time before the exposure could have occurred is wrongly assigned to the exposed group, manufacturing a protective effect</td><td>No. Define exposure and the start of follow-up at the same instant</td></tr>
<tr><td><b>Differential loss to follow-up</b></td><td>Attrition related to both exposure and outcome</td><td>No. Inflation protects power only</td></tr>
<tr><td><b>Time-varying exposure treated as fixed</b></td><td>People who stop or start exposure are misclassified for most of their follow-up</td><td>No. Split person-time at each change</td></tr>
<tr><td><b>Competing risks ignored</b></td><td>People who die of something else cannot have the outcome; Kaplan–Meier overstates cumulative incidence</td><td>No. Use cumulative incidence functions; this also changes the expected event count</td></tr>
<tr><td><b>Too few events for the model</b></td><td>Sparse-data bias inflates the adjusted estimate away from the null</td><td><b>Yes</b> — this one is genuinely a sample size problem</td></tr>
<tr><td><b>Outcome rate lower than assumed</b></td><td>The commonest cause of a failed cohort. Programme rates are usually optimistic</td><td>Partly. Build in an event-driven rather than time-driven stopping point, and sweep the rate</td></tr>
</table>
<div class="note good"><b>The single most useful design move in a cohort:</b> plan to stop on <b>events accrued</b>, not on calendar time elapsed. Then if your background rate assumption was wrong, the study extends rather than failing. Trials have done this for decades; cohorts rarely do.</div>`};

var IMPL_SECTION={id:'implementation',nav:'Implementation research designs',title:'Three implementation research designs',html:
`<p>Implementation research asks a different question from effectiveness research. Effectiveness asks <em>does this work?</em> Implementation asks <em>can this be made to happen, at scale, in real services, and what does it take?</em> The designs below exist because the second question rarely tolerates individual randomisation.</p>
<div class="note"><b>Where stepped-wedge lives.</b> The stepped-wedge cluster randomised trial is the fourth great implementation design and the most statistically demanding. It is covered in full, with its own sample size machinery, on the companion trials site — see the link in the masthead.</div>

<h3>What changes when the question is implementation</h3>
<p>Three things, and each has a sample size consequence.</p>
<ol>
<li><b>The outcome may not be clinical.</b> Proctor and colleagues distinguish eight implementation outcomes — acceptability, adoption, appropriateness, feasibility, fidelity, cost, penetration, sustainability. These are measured on providers, clinics or systems, not patients, so the <b>unit of analysis and therefore the unit of sample size changes.</b> Powering on 4,000 patients when the outcome is adoption by 12 clinics is a category error.</li>
<li><b>The unit of randomisation is almost always a cluster.</b> Which means design effects, intracluster correlation, and a number of clusters that is usually small enough to worry about.</li>
<li><b>The intervention arrives gradually.</b> Implementation is not a switch. Fidelity ramps up over months, which means a treatment effect that varies with exposure time, which the standard analysis models assume away.</li>
</ol>

<h3 style="border-bottom-width:2px">Design 1 — Hybrid effectiveness–implementation</h3>
<p>Curran and colleagues' 2012 typology. The insight is that waiting for effectiveness to be proven before studying implementation wastes years, so blend them deliberately, and declare which blend you are running.</p>
<table>
<tr><th>Type</th><th>Primary focus</th><th>Secondary</th><th>Power the study on</th></tr>
<tr><td><b>Type 1</b></td><td>Clinical effectiveness</td><td>Observe implementation; gather qualitative and descriptive data</td><td>The <b>clinical</b> outcome. Implementation data are descriptive and need a sampling plan, not a power calculation</td></tr>
<tr class="hl"><td><b>Type 2</b></td><td>Both, equally, a priori</td><td>—</td><td><b>Both.</b> Two calculations; take the larger; state that the study is co-primary and handle the multiplicity</td></tr>
<tr><td><b>Type 3</b></td><td>An implementation strategy</td><td>Observe clinical outcomes</td><td>The <b>implementation</b> outcome — usually at cluster level. Clinical outcomes are secondary and should be reported as such</td></tr>
</table>
<div class="note bad"><b>The commonest failure in hybrid protocols.</b> The title says "type 2 hybrid", the sample size section powers only the clinical outcome, and the implementation outcome is then reported with a confidence interval so wide it supports any conclusion. If you claim type 2, show two calculations.</div>
<div class="plainbox"><p>The practical tension in type 2 and type 3 designs: the clinical outcome has thousands of patients and the implementation outcome has perhaps fifteen clinics. Fifteen units is very few. You will often find that no feasible study can power the implementation outcome as a hypothesis test — in which case say so, and size for <b>precision around the implementation estimate</b> instead, which is an honest and defensible objective.</p></div>

<h3 style="border-bottom-width:2px">Design 2 — Interrupted time series</h3>
<p>A population-level outcome is measured repeatedly before and after an intervention that started at a known moment. The pre-intervention trend is the counterfactual: what would have happened had nothing changed. Strong for policies, bans, guideline changes, programme rollouts — anything that happens to everyone at once and so cannot be randomised.</p>
<div class="eq"><div class="lbl">Segmented regression — the corrected specification</div>
${V('Y')}<sub>t</sub> = ${V('&beta;')}<sub>0</sub> + ${V('&beta;')}<sub>1</sub>${V('T')} + ${V('&beta;')}<sub>2</sub>${V('X')}<sub>t</sub> + ${V('&beta;')}<sub>3</sub>(${V('T')} &minus; ${V('T')}<sub>0</sub>)${V('X')}<sub>t</sub>
<div style="margin-top:.55rem;font-size:.9rem;color:var(--ink2)">${V('T')} = time since the series began · ${V('X')}<sub>t</sub> = 0 before the intervention, 1 after · ${V('T')}<sub>0</sub> = the time of the intervention</div></div>
<table>
<tr><th>Term</th><th>Means</th></tr>
<tr><td>β₀</td><td>The level of the outcome at the very start of the series</td></tr>
<tr><td>β₁</td><td>The underlying trend before anything happened — the slope you were already on</td></tr>
<tr><td>β₂</td><td><b>The immediate step.</b> Did the level jump at the moment the intervention began?</td></tr>
<tr><td>β₃</td><td><b>The change in slope.</b> Did the trajectory bend afterwards?</td></tr>
</table>
<div class="note"><b>Read this before you cite the tutorial.</b> The 2017 paper's original equation was algebraically defined in a way that could lead to erroneous interpretation of the parameters. A corrigendum published in 2020 gives the correct form, reproduced above — note the (T − T₀) term rather than T. If you learned ITS from the original, check which version your code implements. This is a live source of misinterpreted β₃ estimates in the published literature.</div>

<div class="plainbox"><p><b>What drives the sample size here is not people — it is time points.</b> You need enough observations before the interruption to establish the pre-existing trend with confidence, and enough after to separate a step from a slope. A study with 60,000 patients spread over eight monthly time points is a weak ITS. A study with 600 patients over sixty monthly points is a strong one.</p></div>
<h4>What determines power in an ITS</h4>
<ul>
<li><b>Number of time points, especially before.</b> Common practical guidance is a minimum in the region of a dozen points either side; more is better, and seasonal outcomes need at least two full cycles before to model seasonality at all.</li>
<li><b>Events per time point.</b> Sparse counts make each point noisy and the trend unidentifiable. Aggregating monthly rather than weekly trades resolution for stability.</li>
<li><b>Autocorrelation.</b> Adjacent points are correlated, which shrinks your effective number of observations exactly as clustering does. Ignoring it produces standard errors that are too small and a false positive.</li>
<li><b>Where the interruption sits.</b> An interruption near either end of the series gives you almost no leverage on one of the two segments.</li>
</ul>

<figure id="fig-its"></figure>

<div class="calc" id="c-its">
<h4>Interrupted time series — is your series long enough?</h4>
<div class="row">
<div class="fieldc"><label>Time points before</label><input type="number" id="it_pre" value="24" step="1" min="2"></div>
<div class="fieldc"><label>Time points after</label><input type="number" id="it_post" value="24" step="1" min="2"></div>
<div class="fieldc"><label>Events per time point (average)</label><input type="number" id="it_ev" value="40" step="5" min="1"></div>
<div class="fieldc"><label>Seasonal outcome?</label><select id="it_se"><option value="0">No</option><option value="1">Yes, annual cycle</option></select></div>
<div class="fieldc"><label>Series frequency</label><select id="it_fr"><option value="12">Monthly</option><option value="52">Weekly</option><option value="4">Quarterly</option></select></div>
</div>
<div class="out" id="it_out"></div>
</div>

<h4>ITS pitfalls</h4>
<table>
<tr><th>Pitfall</th><th>Consequence</th><th>Remedy</th></tr>
<tr><td>Autocorrelation unmodelled</td><td>Intervals too narrow; spurious significance</td><td>Test with Durbin–Watson; model with Prais–Winsten, ARIMA or Newey–West errors</td></tr>
<tr><td>Seasonality unmodelled</td><td>Season mistaken for effect</td><td>Fourier terms or month indicators; needs ≥2 cycles pre</td></tr>
<tr><td>Co-intervention at the same moment</td><td>Effect is unattributable</td><td>A control series that received the co-intervention but not the intervention</td></tr>
<tr><td>Phase-in period</td><td>The step is smeared and attenuated</td><td>Exclude a defined transition window from the model and say so</td></tr>
<tr><td>Regression to the mean</td><td>Intervention triggered by a spike; the fall was going to happen anyway</td><td>Extend the pre-period; use a control series</td></tr>
<tr><td>Autoregression in the outcome itself</td><td>An epidemic outcome is not a regression line</td><td>Do not use ITS for transmissible disease incidence without a transmission-aware model</td></tr>
</table>
<div class="note good"><b>The single upgrade that most improves an ITS:</b> add a control series — a comparable population that did not receive the intervention but shares the same secular trends and shocks. A controlled ITS handles most of the threats above at once, and Lopez Bernal and colleagues wrote a whole follow-up paper on exactly this.</div>

<h3 style="border-bottom-width:2px">Design 3 — Difference-in-differences</h3>
<p>Two groups, two periods. One group gets the intervention, one does not; both are measured before and after. The change in the control group estimates what would have happened to the intervention group anyway, and the difference between the two changes is the effect.</p>
<div class="eq"><div class="lbl">The estimator</div>
DiD = (${V('Ȳ')}<sub>int,post</sub> &minus; ${V('Ȳ')}<sub>int,pre</sub>) &minus; (${V('Ȳ')}<sub>ctl,post</sub> &minus; ${V('Ȳ')}<sub>ctl,pre</sub>)
<div style="margin-top:.55rem;font-size:.9rem;color:var(--ink2)">equivalently, the coefficient on group × period in a regression with group and period main effects</div></div>
<div class="plainbox"><p><b>Everything rests on one assumption:</b> that in the absence of the intervention, the two groups' outcomes would have moved in <em>parallel</em>. Not that they were at the same level — they almost never are, and that is precisely what the design forgives — but that they were changing at the same rate. This is the parallel-trends assumption, and it is an assumption, not a finding.</p></div>
<p>You cannot test parallel trends in the post-period, because that is the thing you are estimating. You can and must test it in the pre-period, which is why <b>difference-in-differences needs multiple pre-intervention time points, not one.</b> A single before-measurement in each group leaves the central assumption entirely unexamined, and reviewers who know the design will say so.</p>
<h4>Sample size for difference-in-differences</h4>
<ul>
<li>If groups are clusters — the usual case — this is a cluster randomised design with baseline measurement. Size it that way: number of clusters is what matters, and the design effect applies.</li>
<li>Baseline measurement buys real efficiency, exactly as a paired design does, in proportion to the correlation between the baseline and follow-up cluster means. High correlation, substantial saving.</li>
<li>The variance is a sum over four means, so the effective standard error is larger than in a simple two-group comparison. A crude planning approximation is to size the two-group comparison and then inflate, unless you have the cluster-level correlation to do it properly.</li>
</ul>
<h4>Difference-in-differences pitfalls</h4>
<table>
<tr><th>Pitfall</th><th>Consequence</th></tr>
<tr><td>Parallel trends assumed, never examined</td><td>The entire estimate is unfounded. Show the pre-period trends in a figure</td></tr>
<tr><td>Differential shocks</td><td>Something else hit one group and not the other during the study window</td></tr>
<tr><td>Compositional change</td><td>The people in each group changed over the period; you are comparing different populations, not the same one over time</td></tr>
<tr><td>Too few clusters</td><td>With a handful of units per arm, standard errors are unreliable; use permutation inference</td></tr>
<tr><td>Staggered adoption analysed as simple DiD</td><td>When units adopt at different times, the two-way fixed-effects estimator can be badly biased — an active area of econometric work, and a reason to prefer a stepped-wedge analysis framework if adoption really is staggered</td></tr>
</table>

<h3>Choosing among the three, and the fourth</h3>
<table>
<tr><th>Situation</th><th>Design</th></tr>
<tr><td>Intervention works; question is whether it can be delivered</td><td>Hybrid type 3</td></tr>
<tr><td>Intervention promising; want both answers at once</td><td>Hybrid type 2</td></tr>
<tr><td>Policy hit everyone simultaneously; long routine data series exists</td><td>Interrupted time series (controlled if possible)</td></tr>
<tr><td>Some districts adopted, others did not, one changeover point</td><td>Difference-in-differences</td></tr>
<tr><td>All units will eventually adopt; you control the order</td><td><b>Stepped wedge</b> — randomise the order. See the trials site</td></tr>
</table>`};

/* ================= 0. FRAME ================= */
{id:'frame',nav:'Start here: what a calculation is',title:'A sample size is four numbers and an argument',html:
`<p>Before any formula, the shape of the thing. Every sample size calculation in epidemiology is built from at most four ingredients, and once you can name them you can read any formula in the literature.</p>
<table>
<tr><th>Ingredient</th><th>What it is</th><th>Where it comes from</th></tr>
<tr><td><b>How wrong you'll tolerate being in one direction</b> (α)</td><td>The chance of announcing an association that is not there</td><td>Convention. 0.05, almost always, for no deep reason</td></tr>
<tr><td><b>How wrong you'll tolerate being in the other</b> (β)</td><td>The chance of missing an association that is there</td><td>Convention. 20% or 10%</td></tr>
<tr><td><b>The effect worth detecting</b></td><td>The smallest difference, ratio or precision that would change what anyone does</td><td><em>You.</em> This is a clinical and policy judgement, not a statistical one, and it is where almost all the argument lives</td></tr>
<tr><td><b>How noisy the outcome is</b></td><td>Prevalence, standard deviation, exposure frequency, clustering</td><td>External data — a pilot, a survey, routine programme records, a published cohort</td></tr>
</table>
<p>Only the last two are yours to get right. α and β are dials set by convention. Which means that when a reviewer challenges your sample size, they are almost never challenging your arithmetic — they are challenging where your effect size and your background rate came from.</p>

<div class="plainbox"><p>If you remember nothing else: <b>the formula is the easy part.</b> A number produced by a calculator is only as defensible as the assumption you fed it. Write down where each input came from, in the protocol, next to the number. Half of sample size review is answering "says who?"</p></div>

<h3>Two different questions, two different mathematics</h3>
<p>There is a fork right at the start that people cross without noticing, and crossing it wrongly is the most common error in observational study design.</p>
<table>
<tr><th></th><th>Precision question</th><th>Power question</th></tr>
<tr><td>You are asking</td><td>"How common is it?" / "How accurate is this test?"</td><td>"Is A associated with B?"</td></tr>
<tr><td>The answer is</td><td>An estimate with a confidence interval</td><td>A comparison with a p-value or an interval around a ratio</td></tr>
<tr><td>You must specify</td><td>α and how wide an interval you can live with</td><td>α, β, the effect size, and the background rate</td></tr>
<tr><td>β appears?</td><td><b>No.</b> There is no power, because nothing is being tested</td><td>Yes</td></tr>
<tr><td>Typical design</td><td>Descriptive cross-sectional survey</td><td>Analytic cross-sectional, case–control, cohort, trial</td></tr>
</table>
<p>A descriptive prevalence survey sized for power, or an analytic study sized for precision alone, are both common and both wrong. The first question to settle is which of these two you are actually doing — and a great many cross-sectional studies are quietly doing both, in which case you size for whichever demands more and say so.</p>

<div class="deep">
<p>The α/β pair is not ancient wisdom. It comes from Neyman and Pearson's 1933 paper, which reframed hypothesis testing as a decision problem with two distinct kinds of error to be traded against each other, in deliberate opposition to Fisher's single-p-value approach. Every formula on this page is an application of that framework: the term containing <span class="m">z</span><sub>1−α/2</sub> is the bar you must clear to control false positives, the term containing <span class="m">z</span><sub>1−β</sub> is the extra margin that makes clearing it likely when the effect is real.</p>
<p>This matters practically, because it explains why the two terms are computed under different assumptions. The α term is evaluated under the null, where the groups are identical and share a pooled proportion. The β term is evaluated under the alternative, where they genuinely differ. When you see two different variance expressions inside one formula, that is what is going on — not an error.</p>
</div>`},

/* ================= 1. CROSS-SECTIONAL ================= */
{id:'xs',nav:'Cross-sectional studies',title:'Cross-sectional studies: the frozen moment',html:
`<p>A cross-sectional study measures exposure and outcome in the same people at more or less the same time. No follow-up, no waiting, no sampling on the basis of who got ill. You take a photograph of a population and count what is in it.</p>
<p>That simplicity is why cross-sectional studies are the workhorse of public health surveillance, and it is also the source of every one of their weaknesses.</p>

<h3>What you can and cannot measure</h3>
<table>
<tr><th>Measure</th><th>Available?</th><th>Note</th></tr>
<tr><td>Prevalence</td><td>Yes</td><td>The natural output. Proportion with the condition at that moment</td></tr>
<tr><td>Prevalence ratio / prevalence odds ratio</td><td>Yes</td><td>Association between exposure and <em>having</em> the condition</td></tr>
<tr><td>Incidence</td><td>No</td><td>You did not watch anyone become a case</td></tr>
<tr><td>Risk ratio, rate ratio</td><td>No</td><td>Requires incident cases and person-time</td></tr>
<tr><td>Temporal order</td><td>Usually no</td><td>You cannot generally tell whether the exposure preceded the outcome</td></tr>
</table>
<p>There is one important bridge between the photograph and the film. In a population that is roughly stable, prevalence, incidence and average duration are linked:</p>
<div class="eq"><div class="lbl">The steady-state relationship</div>
${V('P')}/(1&minus;${V('P')}) &asymp; ${V('I')} &times; ${V('D')} &nbsp;&nbsp; and for an uncommon condition simply &nbsp;&nbsp; ${V('P')} &asymp; ${V('I')} &times; ${V('D')}</div>
<p>Prevalence is incidence multiplied by how long people stay cases. This one line explains a large share of confusing findings. Anything that makes people survive longer with a disease raises its prevalence without changing a single new case. Anything that kills cases quickly lowers prevalence while the disease is getting worse. A cross-sectional study that finds a factor "associated with" a chronic disease may have found a factor associated with surviving it.</p>

<h3>The types, and why the type changes the arithmetic</h3>
<table>
<tr><th>Type</th><th>What it does</th><th>Sized for</th></tr>
<tr class="hl"><td><b>Descriptive prevalence survey</b></td><td>Estimates how common something is. TB prevalence surveys, DHS, serosurveys, coverage surveys</td><td><b>Precision.</b> α and interval width only</td></tr>
<tr><td><b>Analytic cross-sectional</b></td><td>Compares exposed and unexposed on current status; reports a prevalence ratio or POR</td><td><b>Power</b>, as a two-proportion comparison</td></tr>
<tr><td><b>Repeated cross-sectional</b></td><td>Independent samples at two or more time points to detect change. Different people each round</td><td><b>Power</b> to detect a difference between two independent proportions, one per round</td></tr>
<tr><td><b>Serial serosurvey</b></td><td>Repeated cross-sectional with a biomarker; can back out incidence from age or time patterns</td><td>Precision per round, then power for the trend across rounds</td></tr>
<tr><td><b>Two-stage / two-phase</b></td><td>Cheap screen on everyone, expensive confirmation on a subsample</td><td>Both stages separately; the second-stage sampling fraction is itself a design parameter</td></tr>
<tr><td><b>Diagnostic accuracy study</b></td><td>Cross-sectional by structure: index test and reference standard on everyone at once</td><td>Precision, but on two nested subgroups at once (see Buderer)</td></tr>
</table>
<p>The commonest planning failure is sizing a study as though it were the first row when the objectives paragraph plainly describes the second. "We will estimate the prevalence of X and identify factors associated with it" is two studies. The prevalence target might need 545 people; detecting a prevalence ratio of 1.5 in a subgroup that makes up 20% of the sample might need 2,000. Size for both, take the larger, and say in the protocol which objective drove the number.</p>

<h3>What actually determines the number</h3>
<p>For the descriptive case, five things, in rough order of how much they move the answer:</p>
<ol>
<li><b>The precision you demand.</b> It enters squared. Halving the interval width quadruples the sample. This dominates everything.</li>
<li><b>The prevalence itself.</b> Through the term p(1−p), which is largest at p = 0.5 and falls away symmetrically. Being ignorant and using 0.5 is the safe choice, not the lazy one.</li>
<li><b>Clustering.</b> If you sample villages rather than people, the design effect multiplies the whole requirement, often by 1.5 to 3.</li>
<li><b>Non-response.</b> Divide by the fraction you expect to retain.</li>
<li><b>Population size.</b> Only matters if you are sampling more than about 5% of it.</li>
</ol>

<div class="eq"><div class="lbl">Descriptive prevalence survey — the whole thing</div>
${V('n')} = ${FR('z<sup>2</sup><sub>1&minus;&alpha;/2</sub> &middot; '+V('p')+'(1&minus;'+V('p')+')', V('d')+'<sup>2</sup>')} &nbsp;&times; DE &nbsp;&divide; (1 &minus; non-response)
<div style="margin-top:.55rem;font-size:.9rem;color:var(--ink2)">with DE = 1 + (${V('m')} &minus; 1)${V('&rho;')} when you sample ${V('m')} people per cluster, and a finite population correction ${V('n')}/(1 + (${V('n')}&minus;1)/${V('N')}) applied last if the population is small</div></div>

<div class="plainbox">
<p>Read the formula as a sentence. <b>The top</b> is how confident you want to be (squared) times how variable the thing is. <b>The bottom</b> is how precise you insist on being (squared). More confidence or more variability pushes the number up; accepting a wider answer pulls it down fast, because it is squared.</p>
<p>Everything after that is real-world repair work: multiply up because your sampling was clumpy, divide up because some people will not answer.</p>
</div>

<div class="deep">
<p><b>Where it comes from.</b> A proportion estimated from n independent observations has variance p(1−p)/n — the binomial variance divided by n. A 95% confidence interval on the normal approximation runs 1.96 standard errors either side of the estimate. Set that half-width equal to your tolerable error d:</p>
<p style="text-align:center;margin:.7rem 0">1.96 &radic;<span class="rad">p(1−p)/n</span> = d &nbsp;&rArr;&nbsp; 1.96<sup>2</sup> p(1−p)/n = d<sup>2</sup> &nbsp;&rArr;&nbsp; n = 1.96<sup>2</sup> p(1−p)/d<sup>2</sup></p>
<p>That is the entire derivation. Note what it inherits: it is the <b>Wald</b> interval, which is known to behave badly when p is near 0 or 1, in ways that are erratic rather than merely conservative — Brown, Cai and DasGupta document coverage that oscillates wildly with n. Agresti and Coull's title says it outright: approximate is better than exact here. So if your anticipated prevalence is below about 5% or above 95%, compute the sample size this way and then <b>check the realised width using a Wilson score interval</b> at that n before committing. The Wald-derived n can be badly optimistic exactly where prevalence surveys most often operate.</p>
<p>The design effect is Kish's. Its usual form 1 + (m − 1)ρ assumes equal cluster sizes; Bennett and colleagues work instead with the rate of homogeneity and give a field-usable treatment of the whole EPI-style survey, which is the lineage most national prevalence surveys still sit in.</p>
</div>

<div class="calc" id="c-prev">
<h4><span class="tag">Try it</span>Prevalence survey</h4>
<div class="row">
<div class="fieldc"><label>Anticipated prevalence p</label><input type="number" id="pv_p" value="0.15" step="0.01" min="0.0001" max="0.9999"></div>
<div class="fieldc"><label>Absolute precision ± d</label><input type="number" id="pv_d" value="0.03" step="0.005" min="0.0005" max="0.5"></div>
<div class="fieldc"><label>People per cluster (1 = no clustering)</label><input type="number" id="pv_m" value="30" step="1" min="1"></div>
<div class="fieldc"><label>Intracluster correlation ρ</label><input type="number" id="pv_rho" value="0.02" step="0.005" min="0" max="0.99"></div>
<div class="fieldc"><label>Non-response fraction</label><input type="number" id="pv_nr" value="0.15" step="0.05" min="0" max="0.9"></div>
<div class="fieldc"><label>Confidence</label><select id="pv_a"><option value="0.05">95%</option><option value="0.10">90%</option><option value="0.01">99%</option></select></div>
</div>
<div class="out" id="pv_out"></div>
</div>

<h3>Pitfalls specific to cross-sectional designs</h3>
<table>
<tr><th>Pitfall</th><th>What happens</th><th>What to do</th></tr>
<tr><td><b>Prevalence–incidence (Neyman) bias</b></td><td>You sample survivors. A factor that prolongs survival looks like a cause; a factor that kills quickly looks protective</td><td>Say so explicitly. If causation is the question, you need incident cases — which means a different design</td></tr>
<tr><td><b>Temporal ambiguity</b></td><td>Did low BMI cause the disease or did the disease cause low BMI? The photograph cannot tell you</td><td>Restrict to exposures that plainly cannot be consequences (genotype, birth cohort, sex), or change design</td></tr>
<tr><td><b>The Wald interval failing at the extremes</b></td><td>Your realised interval is not the width you paid for</td><td>Check with a Wilson interval at the planned n</td></tr>
<tr><td><b>Design effect ignored</b></td><td>Sized 545, recruited 545, ended up with the precision of 350. Extremely common</td><td>Multiply by DE. If you have no ρ, cite a published compendium and sweep it</td></tr>
<tr><td><b>Relative precision on a rare outcome</b></td><td>"±20% of the estimate" sounds modest until you apply it to a 1% prevalence and need 9,500 people</td><td>Use absolute precision for rare conditions and state it as such</td></tr>
<tr><td><b>Non-response treated as solved by inflation</b></td><td>Inflating protects precision. It does nothing about the fact that non-responders differ</td><td>Budget for follow-up of non-responders; plan a sensitivity analysis</td></tr>
<tr><td><b>Subgroup estimates unplanned</b></td><td>The headline prevalence is precise, every district estimate is useless</td><td>If subgroups are a deliverable, size for the <em>subgroup</em>, not the total</td></tr>
<tr><td><b>POR read as a risk ratio</b></td><td>With a common outcome the prevalence odds ratio exaggerates badly</td><td>Report a prevalence ratio directly (log-binomial or Poisson with robust variance) and size for it</td></tr>
</table>`},

/* ================= 2. CC LOGIC ================= */
{id:'cclogic',nav:'Case–control: the logic',title:'The case–control study: what the reversal buys and what it costs',html:
`<p>A cohort study samples on exposure and waits to see who gets ill. A case–control study does the opposite: it finds people who are already ill, finds comparable people who are not, and looks backwards at exposure.</p>
<p>For a disease affecting 1 in 10,000 a year, a cohort needs tens of thousands of people followed for years to accumulate a few dozen cases. A case–control study gets the same few dozen cases on day one. <b>The efficiency is enormous and it is bought with one specific currency: you give up the ability to measure how common the disease is.</b> You chose how many cases to recruit, so the proportion of your study that is diseased is an artefact of your sampling, not a fact about the world.</p>

<h3>Cornfield's trick, and why it mattered</h3>
<p>Because you cannot measure risk, you cannot directly compute a risk ratio. What you <em>can</em> compute is the ratio of the odds of exposure in cases to the odds of exposure in controls. Cornfield's 1951 contribution was to show that this exposure odds ratio equals the disease odds ratio, and that when the disease is rare, the disease odds ratio approximates the risk ratio you actually wanted.</p>
<div class="eq"><div class="lbl">The 2×2 table, and the symmetry that makes it work</div>
<table style="font-size:.95rem;margin:0">
<tr><th></th><th>Cases</th><th>Controls</th></tr>
<tr><td>Exposed</td><td class="num">a</td><td class="num">b</td></tr>
<tr><td>Not exposed</td><td class="num">c</td><td class="num">d</td></tr>
</table>
<div style="margin-top:.6rem">Odds of exposure among cases &divide; odds among controls = ${FR('a/c','b/d')} = ${FR('ad','bc')}</div>
<div style="margin-top:.4rem;color:var(--ink2);font-size:.9rem">— and ad/bc is also the odds of disease among exposed divided by odds among unexposed. The same number answers both questions. That is the whole trick.</div></div>

<div class="deep">
<p>The rare-disease approximation is easy to see. The risk ratio is p₁/p₀ and the odds ratio is [p₁/(1−p₁)]/[p₀/(1−p₀)]. If both p₁ and p₀ are small, both (1−p) terms are near 1 and the two quantities coincide. As the disease becomes common the odds ratio is pushed away from 1 relative to the risk ratio, and the exaggeration can be dramatic. The exact conversion, given the baseline risk p₀, is</p>
<p style="text-align:center;margin:.7rem 0">RR = OR / [(1 − p₀) + p₀ · OR]</p>
<p>At a baseline risk of 1%, an odds ratio of 3 corresponds to a risk ratio of 2.94 — near enough. At a baseline risk of 30%, an odds ratio of 3 corresponds to a risk ratio of just 1.88. Reported as though it were a risk ratio, that is a sixty per cent overstatement. This is a live problem in the clinical literature, where outcomes are routinely common.</p>
</div>

<div class="calc" id="c-orrr">
<h4><span class="tag">Try it</span>How far apart are the odds ratio and the risk ratio?</h4>
<div class="row">
<div class="fieldc"><label>Odds ratio you would report</label><input type="number" id="or_or" value="3" step="0.1" min="0.01"></div>
<div class="fieldc"><label>Risk in the unexposed (baseline)</label><input type="number" id="or_p0" value="0.30" step="0.01" min="0.0001" max="0.99"></div>
</div>
<div class="out" id="or_out"></div>
</div>

<h3>The thing that is actually going on: how you sampled the controls</h3>
<p>Here is the part most courses skip, and it is the part that determines what your odds ratio means. The "rare disease assumption" is not a statement about the disease. It is a statement about one particular way of choosing controls. Miettinen showed this in 1976; Greenland and Thomas formalised it in 1982; Rodrigues and Kirkwood wrote the version you should actually read in 1990.</p>
<table>
<tr><th>Control sampling scheme</th><th>Controls are drawn from</th><th>The OR estimates</th><th>Rarity needed?</th></tr>
<tr><td><b>Cumulative</b> (exclusive, survivor)</td><td>Those still disease-free at the <em>end</em> of the risk period</td><td>Risk odds ratio → risk ratio</td><td><b>Yes</b></td></tr>
<tr class="hl"><td><b>Density</b> (incidence-density, risk-set, concurrent)</td><td>Those at risk at the <em>moment each case occurs</em></td><td>Incidence rate ratio</td><td><b>No</b></td></tr>
<tr><td><b>Case-base</b> (case-cohort, inclusive)</td><td>The whole cohort at <em>baseline</em>, cases included</td><td>Risk ratio, directly</td><td><b>No</b></td></tr>
</table>
<p>Three different studies, three different estimands, one identical-looking 2×2 table. If a paper does not tell you which scheme it used, you cannot tell what its odds ratio means — and Knol and colleagues found that most papers do not tell you.</p>
<div class="note"><b>What to do about it.</b> State the scheme in your methods in one sentence: "Controls were sampled by incidence density from those at risk at the time of each case's diagnosis, so the odds ratio estimates the incidence rate ratio." That sentence costs nothing and settles the interpretation permanently.</div>`},

/* ================= 3. CC TYPES ================= */
{id:'cctypes',nav:'Types of case–control study',title:'The family of case–control designs',html:
`<p>Below, each design in the family: what it is, when it earns its place, and — the point of this page — what changes in the sample size calculation.</p>

<h3>1. Classic unmatched case–control</h3>
<p>Recruit cases from a defined source population, recruit controls from that same population without individual matching, compare exposure. The default, and the right default.</p>
<p><b>Sample size drivers:</b> exposure prevalence among controls p₀, the odds ratio to detect, controls per case, α, power. Nothing else.</p>
<p><b>Watch:</b> controls must come from the population that produced the cases. That is the study base principle in Wacholder's first paper, and violating it is the commonest fatal flaw in the design.</p>

<h3>2. Density-sampled case–control</h3>
<p>The same thing, except controls are selected from those still at risk at the instant each case occurs. A control can later become a case. A person can be sampled as a control more than once.</p>
<p><b>Why bother:</b> the odds ratio estimates the incidence rate ratio with no rarity assumption, and it handles a dynamic population where people enter and leave.</p>
<p><b>Sample size:</b> the same formulae as unmatched, with p₀ interpreted as exposure prevalence in the person-time at risk. If you match controls to cases on time, analyse and size it as a matched study.</p>

<h3>3. Nested case–control</h3>
<p>Case–control sampling <em>inside</em> an assembled cohort. Everyone's specimens or records already exist; you only pay to assay the cases and their sampled controls.</p>
<p><b>Why bother:</b> a biomarker assay at £200 a sample across 40,000 people is unaffordable; across 300 cases and 900 controls it is not. You get most of the information for a fraction of the cost.</p>
<p><b>Sample size:</b> the number of cases is fixed by the cohort — you cannot recruit more. The design question is therefore reversed: <em>given</em> the cases the cohort will produce, how many controls per case do you need, and is that enough? Use the back-solving approach rather than the forward one.</p>

<h3>4. Case-cohort</h3>
<p>Cases plus a random subcohort drawn from the full cohort at baseline. The subcohort is a sample of the <em>base</em>, so it includes people who later become cases.</p>
<p><b>Why bother:</b> the odds ratio estimates the risk ratio directly, and — the real selling point — the <b>same subcohort serves as the comparison group for every outcome you study</b>. One expensive assay run, many analyses. For a cohort studying five outcomes this is transformative.</p>
<p><b>Sample size:</b> needs specialised methods, because subcohort members who become cases appear in both groups and the standard variance is wrong. Cai and Zeng and others have developed power methods; do not use the unmatched formula and hope.</p>

<h3>5. Individually matched</h3>
<p>Each case is paired with one or more controls chosen to be similar on specified variables — age, sex, clinic, calendar time, neighbourhood.</p>
<p><b>Why bother:</b> to control confounders that are hard to measure but easy to match on. Neighbourhood matching controls an enormous amount of unmeasured social and environmental confounding in one move.</p>
<p><b>Sample size — and this is the important bit:</b> matching <b>does not automatically save you sample size; it usually costs you some.</b> A matched study must be analysed with conditional methods (McNemar, conditional logistic regression), which use only the discordant pairs. The more successfully you matched on something correlated with the exposure, the fewer discordant pairs you get, and the more pairs you need. Dupont's φ is exactly this quantity. See the calculator below.</p>
<div class="note bad"><b>Overmatching.</b> Match on a variable that lies on the causal pathway from exposure to disease and you will bias the odds ratio towards the null — no sample size can rescue that. Match on a strong determinant of the exposure that is not a confounder and you simply throw away power for nothing. Match sparingly, on genuine confounders, and never on anything the exposure could plausibly cause.</div>

<h3>6. Frequency (category) matched</h3>
<p>Controls are selected so that their distribution of age, sex and so on resembles the cases' overall, without pairing individuals.</p>
<p><b>Sample size:</b> treat as unmatched but adjust for the matching variables in the analysis, and inflate for the variance inflation that adjustment costs. Simpler to run than individual matching and usually enough.</p>

<h3>7. Case-crossover</h3>
<p>Only cases. Each person's exposure in the window just before the event is compared with their own exposure in earlier reference windows.</p>
<p><b>Why bother:</b> every stable characteristic of the person is controlled by design, perfectly, at no cost. There is no control group to select badly. Ideal for transient exposures and abrupt outcomes: heavy exertion and myocardial infarction, air pollution and admission, a drug dose and a fall.</p>
<p><b>Requires:</b> a transient exposure, an abrupt outcome, and a well-defined induction window. It fails for chronic exposures, and it is vulnerable to exposure time trends — which is what the case-time-control design was invented to fix.</p>
<p><b>Sample size:</b> the matched-pair machinery, with φ now representing within-person exposure correlation across windows, which is typically <em>high</em>. High φ means many concordant windows, few informative ones, and a larger study than people expect.</p>

<h3>8. Test-negative design</h3>
<p>Enrol everyone who presents with the syndrome, test them all, compare the odds of vaccination in test-positives with test-negatives. Now the standard for vaccine effectiveness.</p>
<p><b>Why bother:</b> restricting to people who sought care holds health-seeking behaviour roughly constant between the compared groups, which is the confounder that wrecks conventional vaccine effectiveness studies.</p>
<p><b>Sample size:</b> unmatched case–control machinery, with a twist — you cannot recruit cases and controls independently. You enrol a syndromic stream and the test result splits it. So you must size on <b>the number to enrol</b>, using the expected test-positivity fraction, exactly as in a diagnostic accuracy study. Under-planning for a low-positivity season is the standard way these studies fail.</p>

<h3>9. Self-controlled case series</h3>
<p>Only cases, again, but the unit is person-time: compare the incidence rate inside a defined risk window after exposure with the rate outside it, within the same individuals.</p>
<p><b>Why bother:</b> the workhorse of vaccine safety surveillance. All time-invariant confounding is eliminated.</p>
<p><b>Sample size:</b> driven by the number of events and the proportion of observation time that falls inside the risk window. Use Farrington-lineage methods, not the case–control formulae.</p>

<h3>Choosing between them</h3>
<table>
<tr><th>If…</th><th>Use</th></tr>
<tr><td>Rare disease, no existing cohort</td><td>Unmatched case–control, population controls</td></tr>
<tr><td>Common disease, want a rate ratio</td><td>Density sampling</td></tr>
<tr><td>Common disease, want a risk ratio</td><td>Case-base / case-cohort</td></tr>
<tr><td>Cohort exists, assay is expensive, one outcome</td><td>Nested case–control</td></tr>
<tr><td>Cohort exists, assay is expensive, several outcomes</td><td>Case-cohort</td></tr>
<tr><td>Strong unmeasurable confounding by place or family</td><td>Individually matched</td></tr>
<tr><td>Transient exposure, abrupt event</td><td>Case-crossover</td></tr>
<tr><td>Vaccine effectiveness against a testable infection</td><td>Test-negative</td></tr>
<tr><td>Vaccine or drug safety, recurrent or acute events</td><td>Self-controlled case series</td></tr>
</table>`},

/* ================= 4. CC SAMPLE SIZE ================= */
{id:'ccsize',nav:'Sizing a case–control study',title:'Sizing a case–control study, term by term',html:
`<h3>Step 1 — turn the odds ratio into something the formula can use</h3>
<p>The formula compares two proportions. You have an odds ratio. So the first move, and Schlesselman's 1974 contribution, is to convert.</p>
<div class="eq"><div class="lbl">Exposure prevalence implied among cases</div>
${V('p')}<sub>1</sub> = ${FR('OR &middot; '+V('p')+'<sub>0</sub>','1 + '+V('p')+'<sub>0</sub>(OR &minus; 1)')}</div>
<div class="plainbox"><p>You supply two things you can actually defend: <b>how common the exposure is among people without the disease</b> (from a survey of your population) and <b>the smallest odds ratio that would matter</b> (from clinical or policy judgement). The formula works out what exposure prevalence among cases those two imply. You never guess p₁ directly.</p></div>
<div class="deep"><p>The algebra is one line. By definition OR = [p₁/(1−p₁)] ÷ [p₀/(1−p₀)]. Multiply through: p₁/(1−p₁) = OR · p₀/(1−p₀). Cross-multiply and collect p₁: p₁ = OR·p₀ / (1 − p₀ + OR·p₀), which is the expression above. It is a Möbius transformation — it maps the interval (0,1) onto itself, which is why p₁ can never come out impossible however extreme the odds ratio.</p></div>

<div class="calc" id="c-or2p">
<h4><span class="tag">Try it</span>Odds ratio → exposure prevalence among cases</h4>
<div class="row">
<div class="fieldc"><label>Exposure among controls p₀</label><input type="number" id="cv_p0" value="0.20" step="0.01" min="0.0001" max="0.9999"></div>
<div class="fieldc"><label>Odds ratio to detect</label><input type="number" id="cv_or" value="2.0" step="0.1" min="0.01"></div>
</div>
<div class="out" id="cv_out"></div>
</div>

<h3>Step 2 — the two-proportion formula, read as English</h3>
<div class="eq"><div class="lbl">Cases required (controls = k × cases)</div>
${V('n')}<sub>cases</sub> = ${FR('['+zA+' '+SQ('(1+1/'+V('k')+')'+V('p&#772;')+'(1&minus;'+V('p&#772;')+')')+' + '+zB+' '+SQ(V('p')+'<sub>1</sub>(1&minus;'+V('p')+'<sub>1</sub>) + '+V('p')+'<sub>0</sub>(1&minus;'+V('p')+'<sub>0</sub>)/'+V('k'))+']<sup>2</sup>','('+V('p')+'<sub>1</sub> &minus; '+V('p')+'<sub>0</sub>)<sup>2</sup>')}
<div style="margin-top:.55rem;font-size:.9rem;color:var(--ink2)">where ${V('p&#772;')} = (${V('p')}<sub>1</sub> + ${V('k')}${V('p')}<sub>0</sub>) / (1 + ${V('k')}) is the pooled exposure prevalence</div></div>

<div class="plainbox">
<p><b>Bottom of the fraction:</b> how far apart the two exposure prevalences are. Squared. This is the engine. Halve the gap you want to detect and you quadruple the study.</p>
<p><b>Top of the fraction, first term:</b> the noise you must climb over to keep false positives at 5%. Computed as if the two groups were identical — hence the pooled p̄.</p>
<p><b>Top of the fraction, second term:</b> the extra margin so that a real difference reliably clears that bar. Computed as if the groups genuinely differ — hence the two separate variances.</p>
<p><b>The 1/k terms:</b> more controls per case shrink the control group's contribution to the noise. That is the entire mathematical reason extra controls help.</p>
</div>

<div class="deep">
<p>The continuity correction. The formula treats discrete counts as continuous. Casagrande, Pike and Smith derived the correction for equal groups; Fleiss, Tytun and Ury generalised it to unequal ones:</p>
<p style="text-align:center;margin:.7rem 0">n′ = ${FR('n','4')} <span class="paren">[</span>1 + ${SQ('1 + '+FR('2(1 + 1/k)','n |p<sub>1</sub>&minus;p<sub>0</sub>|'))}<span class="paren">]</span><sup>2</sup></p>
<p>It always increases n, typically by 5–15%, and it brings the answer into line with a chi-squared test using Yates' correction or with Fisher's exact test. Software disagrees on whether to apply it by default, which is the single commonest reason two calculators give you two different answers for the same inputs. State which you used.</p>
</div>

<div class="calc" id="c-cc">
<h4><span class="tag">Try it</span>Unmatched case–control sample size</h4>
<div class="row">
<div class="fieldc"><label>Exposure among controls p₀</label><input type="number" id="cc_p0" value="0.20" step="0.01" min="0.0001" max="0.9999"></div>
<div class="fieldc"><label>Odds ratio to detect</label><input type="number" id="cc_or" value="2.0" step="0.1" min="0.01"></div>
<div class="fieldc"><label>Controls per case (k)</label><input type="number" id="cc_k" value="1" step="1" min="0.1" max="20"></div>
<div class="fieldc"><label>Power</label><select id="cc_pw"><option value="0.80">80%</option><option value="0.90">90%</option></select></div>
<div class="fieldc"><label>Two-sided α</label><input type="number" id="cc_a" value="0.05" step="0.005" min="0.001" max="0.3"></div>
<div class="fieldc"><label>Continuity correction</label><select id="cc_cc"><option value="1">Apply</option><option value="0">Do not apply</option></select></div>
</div>
<div class="out" id="cc_out"></div>
</div>

<h3>Step 3 — how many controls per case?</h3>
<p>The variance of the comparison is proportional to (1 + 1/k). At k = 1 that is 2; at infinitely many controls it is 1. So the very best you can ever do by adding controls is halve the number of cases you need — and you approach that limit slowly.</p>

<div class="calc" id="c-ctrl">
<h4><span class="tag">Try it</span>What each extra control actually buys</h4>
<div class="out" id="ctrl_out"></div>
</div>

<div class="deep">
<p>Ury 1975 gives the relative efficiency of M controls per case compared with one as 2M/(M+1). Gail and colleagues framed the same question as a cost problem in "How many controls?" — if a case costs C<sub>case</sub> to recruit and a control costs C<sub>ctrl</sub>, the cost-optimal ratio is approximately &radic;<span class="rad">C<sub>case</sub>/C<sub>ctrl</sub></span>. Cases ten times more expensive than controls → about three controls each. That is a more honest basis for the decision than the folk rule, and it is what the paper actually argues.</p>
</div>

<h3>Step 4 — if the design is matched</h3>
<p>A matched study is analysed with McNemar's test or conditional logistic regression, both of which discard every pair where case and control had the same exposure. Sample size therefore depends on the <b>discordant</b> pairs, and Dupont's parameterisation gets you there from quantities you can actually estimate.</p>
<div class="eq"><div class="lbl">Dupont's parameters → discordant probabilities</div>
${V('p')}<sub>11</sub> = ${V('p')}<sub>1</sub>${V('p')}<sub>0</sub> + ${V('&phi;')} ${SQ(V('p')+'<sub>1</sub>(1&minus;'+V('p')+'<sub>1</sub>)'+V('p')+'<sub>0</sub>(1&minus;'+V('p')+'<sub>0</sub>)')}
&nbsp;&nbsp;&rarr;&nbsp;&nbsp; ${V('&pi;')}<sub>10</sub> = ${V('p')}<sub>1</sub> &minus; ${V('p')}<sub>11</sub>, &nbsp; ${V('&pi;')}<sub>01</sub> = ${V('p')}<sub>0</sub> &minus; ${V('p')}<sub>11</sub>
<div style="margin-top:.6rem">then &nbsp; ${V('n')}<sub>pairs</sub> = ${FR('['+zA+' '+SQ(V('&pi;')+'<sub>d</sub>')+' + '+zB+' '+SQ(V('&pi;')+'<sub>d</sub> &minus; ('+V('&pi;')+'<sub>10</sub>&minus;'+V('&pi;')+'<sub>01</sub>)<sup>2</sup>')+']<sup>2</sup>','('+V('&pi;')+'<sub>10</sub> &minus; '+V('&pi;')+'<sub>01</sub>)<sup>2</sup>')} &nbsp; with ${V('&pi;')}<sub>d</sub> = ${V('&pi;')}<sub>10</sub> + ${V('&pi;')}<sub>01</sub></div></div>

<div class="plainbox"><p><b>φ is the price of matching, and it is a real price.</b> It measures how alike a case and its matched control are in their exposure. At φ = 0 the matching happened to be unrelated to the exposure and costs you nothing. As φ rises, more and more pairs agree on exposure — and a pair where both were exposed, or neither was, tells the analysis nothing at all and is discarded. The study must grow to replace the pairs it is throwing away.</p>
<p>This is the most misunderstood point in case–control design. <b>Matching is a device for controlling confounding, not for saving sample size.</b> It usually costs sample size. Match because you need that confounding controlled and cannot get at it another way, then pay for it knowingly.</p></div>

<div class="calc" id="c-match">
<h4><span class="tag">Try it</span>Matched case–control (Dupont parameterisation)</h4>
<div class="row">
<div class="fieldc"><label>Exposure among controls p₀</label><input type="number" id="mt_p0" value="0.20" step="0.01" min="0.0001" max="0.9999"></div>
<div class="fieldc"><label>Odds ratio ψ</label><input type="number" id="mt_or" value="2.0" step="0.1" min="0.01"></div>
<div class="fieldc"><label>Matching correlation φ</label><input type="number" id="mt_phi" value="0.2" step="0.05" min="0" max="0.95"></div>
<div class="fieldc"><label>Controls per case (M)</label><input type="number" id="mt_m" value="1" step="1" min="1" max="10"></div>
<div class="fieldc"><label>Power</label><select id="mt_pw"><option value="0.80">80%</option><option value="0.90">90%</option></select></div>
<div class="fieldc"><label>Two-sided α</label><input type="number" id="mt_a" value="0.05" step="0.005" min="0.001" max="0.3"></div>
</div>
<div class="out" id="mt_out"></div>
</div>
<div class="note"><b>How this is implemented, so you can reproduce it.</b> ψ here is the odds ratio a matched analysis actually estimates — the conditional one, π<sub>10</sub>/π<sub>01</sub>. Given ψ, p<sub>0</sub> and φ, the four pair-type probabilities are determined, and are solved for numerically; Connor’s formula for McNemar’s test then gives the number of pairs. Multiple controls use the standard (M+1)/2M efficiency scaling, which is an approximation — Dupont’s paper gives the exact treatment. As a check on the construction: at φ = 0 it reproduces the unmatched requirement to within a couple of per cent, which is what theory says it should. Expect small differences between software packages and state which you used.</div>

<h3>Step 5 — the calculation almost nobody does, and should</h3>
<p>Everything above sizes for a hypothesis test. But almost no case–control paper concludes "p &lt; 0.05" and stops — it reports an odds ratio with a confidence interval, and the reader judges the interval. So size for the interval.</p>
<p>Woolf gave us the tool in 1955: the variance of the log odds ratio is the sum of the reciprocals of the four cell counts.</p>
<div class="eq"><div class="lbl">Woolf's variance, and what it implies for planning</div>
var(ln OR) = ${FR('1','a')} + ${FR('1','b')} + ${FR('1','c')} + ${FR('1','d')}
<div style="margin-top:.55rem;font-size:.93rem">With ${V('n')} cases and ${V('kn')} controls: var = ${FR('1',V('n')+V('p')+'<sub>1</sub>')} + ${FR('1',V('n')+'(1&minus;'+V('p')+'<sub>1</sub>)')} + ${FR('1',V('kn')+V('p')+'<sub>0</sub>')} + ${FR('1',V('kn')+'(1&minus;'+V('p')+'<sub>0</sub>)')}</div>
<div style="margin-top:.4rem;font-size:.93rem">and the 95% interval spans a multiplicative factor of exp(2 &times; 1.96 &times; ${SQ('var')}) from bottom to top</div></div>
<div class="plainbox"><p>The practical reading: <b>your confidence interval is governed by the smallest cell in your table.</b> One rare cell — a rare exposure among a small case group — dominates the sum of reciprocals and blows the interval wide open, no matter how large the other three cells are. This is why a study with 800 participants can still produce an odds ratio of 2.1 with an interval from 0.9 to 4.9.</p></div>

<div class="calc" id="c-woolf">
<h4><span class="tag">Try it</span>How wide will my confidence interval be?</h4>
<div class="row">
<div class="fieldc"><label>Exposure among controls p₀</label><input type="number" id="wf_p0" value="0.20" step="0.01" min="0.0001" max="0.9999"></div>
<div class="fieldc"><label>Odds ratio expected</label><input type="number" id="wf_or" value="2.0" step="0.1" min="0.01"></div>
<div class="fieldc"><label>Number of cases</label><input type="number" id="wf_n" value="187" step="10" min="5"></div>
<div class="fieldc"><label>Controls per case</label><input type="number" id="wf_k" value="1" step="1" min="0.1" max="20"></div>
</div>
<div class="out" id="wf_out"></div>
</div>

<h3>Step 6 — the adjustments you apply last</h3>
<table>
<tr><th>Adjustment</th><th>Do what</th><th>When</th></tr>
<tr><td>Covariate adjustment</td><td>Multiply by VIF = 1/(1 − R²)</td><td>Always, if the primary estimate is adjusted. R² is the squared multiple correlation between the exposure and the confounders</td></tr>
<tr><td>Non-participation</td><td>Divide by the expected participation fraction</td><td>Always. Case–control participation rates of 60–70% are normal and must be planned for</td></tr>
<tr><td>Multiple exposures</td><td>Divide α, or say plainly that the study is exploratory</td><td>If you have several primary hypotheses. A 40-exposure questionnaire study has no primary hypothesis</td></tr>
<tr><td>Misclassification of exposure</td><td>Inflate substantially, or model it</td><td>Non-differential misclassification biases towards the null, so the effect you can detect is smaller than the one you specified</td></tr>
</table>
<div class="note"><b>The misclassification point is badly under-appreciated.</b> If your exposure is self-reported with 80% sensitivity and 90% specificity, the odds ratio you will observe is materially closer to 1 than the true one. Sizing for the true odds ratio then leaves you underpowered for the one you will actually see. Either improve the measurement or size for the attenuated value.</div>`},

{id:'pitfalls',nav:'Pitfalls: a checklist',title:'The things that go wrong',html:
`<h3>Design pitfalls</h3>
<table>
<tr><th>Problem</th><th>What it does</th><th>Can sample size fix it?</th></tr>
<tr><td><b>Controls from a different base</b></td><td>Selection bias. The comparison is between two populations, not two exposure groups</td><td><b>No.</b> More people gives a tighter interval around a wrong number</td></tr>
<tr><td><b>Berkson bias</b> (hospital controls)</td><td>Admission depends on both exposure and disease, manufacturing association</td><td><b>No.</b> Use population controls, or several control groups with different biases</td></tr>
<tr><td><b>Recall bias</b></td><td>Cases remember exposures harder than controls do</td><td><b>No.</b> Use records, blind interviewers, or a design with objective exposure</td></tr>
<tr><td><b>Overmatching on a mediator</b></td><td>Biases the odds ratio towards the null</td><td><b>No.</b> Do not match on it</td></tr>
<tr><td><b>Prevalent rather than incident cases</b></td><td>You study survival, not causation</td><td><b>No.</b> Recruit incident cases</td></tr>
<tr><td><b>Unstated control-sampling scheme</b></td><td>Nobody, including you, knows what the odds ratio estimates</td><td>Not a size problem — a sentence in the methods fixes it</td></tr>
</table>
<div class="note bad"><b>The six rows above are the point of this section.</b> Sample size arithmetic controls random error and nothing else. A perfectly powered study with a badly chosen control group produces a confidently wrong answer, and its tight confidence interval makes it more persuasive, not less. Spend your design effort on the base, the controls and the measurement first; the arithmetic afterwards.</div>

<h3>Calculation pitfalls</h3>
<table>
<tr><th>Problem</th><th>Symptom</th><th>Fix</th></tr>
<tr><td><b>Effect size chosen backwards</b></td><td>The protocol's odds ratio happens to be exactly what the affordable sample can detect</td><td>Choose the effect from clinical meaning first, then find out what it costs, then negotiate openly</td></tr>
<tr><td><b>p₀ from the wrong population</b></td><td>Exposure prevalence taken from a national survey when you will recruit from a tertiary hospital</td><td>Use local data. Sweep the value and report the range</td></tr>
<tr><td><b>Effect size from a pilot</b></td><td>A pilot is too small to estimate an effect; using its point estimate gives roughly a coin-flip chance of success</td><td>Pilots inform feasibility and variability, not effect size</td></tr>
<tr><td><b>Rare exposure</b></td><td>Requirement explodes and nobody notices until recruitment stalls</td><td>Check the exposure prevalence early. Below about 5% consider exposure-based sampling instead</td></tr>
<tr><td><b>Sparse cells</b></td><td>Logistic regression gives an implausibly large odds ratio</td><td>Watch the smallest cell, not the total n. Greenland and colleagues on sparse data bias</td></tr>
<tr><td><b>Post-hoc power</b></td><td>Reviewer asks for the power of a null finding</td><td>Report the confidence interval instead, and cite Hoenig and Heisey</td></tr>
<tr><td><b>Continuity correction mismatch</b></td><td>Two calculators, two answers, panic</td><td>Usually this and nothing else. State which you applied</td></tr>
<tr><td><b>Matching assumed to save sample</b></td><td>Study is underpowered because φ was higher than assumed</td><td>Size the matched design as matched, with a realistic φ</td></tr>
<tr><td><b>Test-negative sized as if cases were recruitable</b></td><td>Season ends with a third of the planned test-positives</td><td>Size on enrolment, using expected positivity</td></tr>
</table>

<h3>A protocol paragraph that survives review</h3>
<div class="note good"><p>State, in order: the design and the control-sampling scheme; the primary exposure and outcome; the effect size you are powering for <em>and where it came from</em>; the exposure prevalence among controls <em>and its source</em>; α, sidedness and power; the allocation ratio; the software or formula with its citation; the adjustments for non-participation and covariates; and one sentence of sensitivity — what the requirement becomes if the background rate is wrong by a third. Nine clauses. Most papers give three, and STROBE item 10 asks for all of them.</p></div>`},
