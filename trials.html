<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinical trial designs & sample size — Raghavan Parthasarathy</title>
<meta name="description" content="Parallel, cluster, stepped wedge, crossover, non-inferiority, adaptive and platform trials: design, sample size, analysis plans, case studies and interactive explorers.">
<meta name="author" content="Raghavan Parthasarathy">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  --paper:#f2efe6; --card:#fbf9f4; --sunk:#e9e4d6; --rule:#cfc7b4;
  --ink:#221f1a; --ink2:#585245; --ink3:#8a8171;
  --ox:#8f3324; --sea:#24506b; --ochre:#a8760f; --moss:#3f6146; --plum:#5d3a63;
  --serif:'Spectral',Georgia,'Times New Roman',serif;
  --disp:'Fraunces','Spectral',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
html[data-theme="dark"]{
  --paper:#16150f; --card:#1d1c15; --sunk:#24221a; --rule:#3a3728;
  --ink:#ece7d8; --ink2:#a9a290; --ink3:#7d7666;
  --ox:#d97a63; --sea:#7fb2cf; --ochre:#d9ad4a; --moss:#87b593; --plum:#b795bd;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:17.5px;line-height:1.68;
  background-image:repeating-linear-gradient(135deg,transparent 0 22px,color-mix(in srgb,var(--rule) 14%,transparent) 22px 23px);
  -webkit-font-smoothing:antialiased}
a{color:var(--ox);text-underline-offset:3px}
h1,h2,h3,h4{font-family:var(--disp);font-weight:600;line-height:1.18;margin:0 0 .45em;letter-spacing:-.008em}
h1{font-size:1.95rem;font-weight:800}
h2{font-size:1.35rem}
h3{font-size:1.1rem;margin-top:1.7em;padding-bottom:.2em;border-bottom:1px solid var(--rule)}
h4{font-size:.98rem;margin-top:1.3em;font-family:var(--serif);font-weight:600}
p{margin:0 0 .9em}
.kicker{font-family:var(--mono);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ox);display:block;margin-bottom:.6rem}

/* ---- masthead ---- */
.mast{position:sticky;top:0;z-index:60;background:var(--paper);border-bottom:2px solid var(--ink)}
.mast-in{max-width:1360px;margin:0 auto;padding:.5rem 1.1rem;display:flex;gap:.55rem;align-items:center;flex-wrap:wrap}
.logo{font-family:var(--disp);font-weight:800;font-size:1rem;letter-spacing:-.01em;display:flex;align-items:center;gap:.55rem;text-decoration:none;color:var(--ink)}
.logo .mk{width:21px;height:21px;flex:none}
.sitenav{display:flex;gap:.1rem;margin-left:1rem;margin-right:auto;flex-wrap:wrap}
.sitenav a{font-family:var(--mono);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;
  padding:.3rem .6rem;text-decoration:none;color:var(--ink2);border-bottom:2px solid transparent}
.sitenav a:hover{color:var(--ink)}
.sitenav a.here{color:var(--ox);border-bottom-color:var(--ox);font-weight:500}
.btn{background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:0;padding:.28rem .65rem;
  font-family:var(--mono);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.on{background:var(--ox);border-color:var(--ox);color:#fff}

/* ---- tab bar ---- */
.tabbar{position:sticky;top:43px;z-index:55;background:var(--paper);border-bottom:1px solid var(--rule);overflow-x:auto}
.tabbar-in{max-width:1360px;margin:0 auto;padding:0 1.1rem;display:flex;gap:0;white-space:nowrap}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;color:var(--ink2);
  padding:.65rem .85rem .5rem;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer;position:relative}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ox);border-bottom-color:var(--ox);font-weight:500}
.tab .n{font-size:.62rem;opacity:.6;margin-right:.35rem}
.tabpanel{display:none}
.tabpanel.on{display:block}

.shell{max-width:1360px;margin:0 auto;padding:1.3rem 1.1rem 4rem}
section{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--ink);
  padding:1.5rem 1.7rem;margin-bottom:1.6rem;scroll-margin-top:96px}
@media(max-width:600px){section{padding:1.05rem .9rem}}

/* ---- depth layers ---- */
.deep{border-left:3px double var(--sea);padding:.2rem 0 .2rem 1rem;margin:1rem 0;color:var(--ink2)}
.deep::before{content:"\2198 Derivation & provenance";display:block;font-family:var(--mono);font-size:.62rem;
  letter-spacing:.13em;text-transform:uppercase;color:var(--sea);margin-bottom:.45rem}
body.plain .deep{display:none}
.plainbox{background:var(--sunk);border-left:3px solid var(--ox);padding:.9rem 1.05rem;margin:1rem 0}
.plainbox::before{content:"\25C6 In plain words";display:block;font-family:var(--mono);font-size:.62rem;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ox);margin-bottom:.45rem}

/* ---- maths ---- */
.eq{background:var(--sunk);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  padding:1rem 1.1rem;margin:1rem 0;overflow-x:auto;font-size:1.05rem}
.eq .lbl{font-family:var(--mono);font-size:.61rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-bottom:.5rem}
.m{font-style:italic;font-family:'Spectral',Georgia,serif}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .22em}
.frac>span{padding:0 .35em}
.frac>span:first-child{border-bottom:1.2px solid currentColor;padding-bottom:.1em}
.frac>span:last-child{padding-top:.1em}
.rad{border-top:1.2px solid currentColor;padding:.05em .2em 0 .1em;margin-left:-.1em}
.paren{font-size:1.35em;vertical-align:-.12em}
sub,sup{font-size:.68em}

table{width:100%;border-collapse:collapse;font-size:.89rem;display:block;overflow-x:auto;margin:.8rem 0}
@media(min-width:640px){table{display:table}}
th,td{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--rule);vertical-align:top}
tr:first-child th{border-bottom:1.5px solid var(--ink)}
th{color:var(--ink3);font-weight:400;font-family:var(--mono);font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.86rem}
tr.hl td{background:color-mix(in srgb,var(--ochre) 16%,transparent)}

.note{border-left:3px solid var(--ochre);padding:.55rem .9rem;font-size:.92rem;margin:.9rem 0;color:var(--ink2)}
.note.bad{border-left-color:var(--ox)}
.note.good{border-left-color:var(--moss)}
.note b,.note strong{color:var(--ink)}
ul,ol{margin:.35rem 0 .95rem;padding-left:1.3rem}
li{margin-bottom:.38rem}
.pill{display:inline-block;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule);padding:.06rem .45rem;color:var(--ink3);margin-right:.3rem;white-space:nowrap}
.pill.ok{color:var(--moss);border-color:var(--moss)}
.pill.check{color:var(--ochre);border-color:var(--ochre)}

.cs{border:1px solid var(--ink);border-left:5px solid var(--sea);padding:1.05rem 1.2rem;margin:1.2rem 0;background:var(--card)}
.cs h4{margin-top:0;font-family:var(--disp);font-size:1.02rem}
.cs .meta{font-family:var(--mono);font-size:.68rem;color:var(--ink3);margin-bottom:.6rem}

/* ---- calculators ---- */
.calc{border:1px dashed var(--ink2);padding:1rem 1.1rem;margin:1.2rem 0;background:var(--sunk)}
.calc h4{margin:0 0 .7rem;font-family:var(--mono);font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ox)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:.5rem .9rem}
label{display:block;font-size:.75rem;color:var(--ink2);margin-bottom:.12rem;font-family:var(--mono)}
input,select{background:var(--card);border:1px solid var(--ink2);color:var(--ink);border-radius:0;
  padding:.32rem .45rem;font-family:var(--mono);font-size:.88rem;width:100%}
input:focus,select:focus{outline:2px solid var(--ox);outline-offset:-2px}
.fieldc{margin-bottom:.5rem}
.out{margin-top:.8rem;padding-top:.8rem;border-top:1px solid var(--ink2);font-size:.92rem}
.big{font-family:var(--disp);font-size:1.6rem;font-weight:800;color:var(--ox);line-height:1.15}

/* ---- explorer ---- */
.xp{border:2px solid var(--ink);margin:1.5rem 0;background:var(--card)}
.xp-head{background:var(--ink);color:var(--paper);padding:.5rem .95rem;display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.xp-head .tag{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.xp-head .ttl{font-family:var(--disp);font-weight:600;font-size:1rem}
.xp-body{padding:1rem 1.1rem}
.xp-blurb{font-size:.93rem;color:var(--ink2);margin-bottom:.9rem}
.xp-grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:1.2rem;align-items:start}
@media(max-width:820px){.xp-grid{grid-template-columns:1fr}}
.xp-ctrl{border-left:1px solid var(--rule);padding-left:1rem}
@media(max-width:820px){.xp-ctrl{border-left:0;padding-left:0;border-top:1px solid var(--rule);padding-top:.8rem}}
.sl{margin-bottom:.85rem}
.sl .lab{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:.7rem;color:var(--ink2);margin-bottom:.2rem}
.sl .lab b{color:var(--ox);font-size:.82rem;font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;padding:0;border:0}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--rule)}
input[type=range]::-moz-range-track{height:3px;background:var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;background:var(--ox);
  border:2px solid var(--card);margin-top:-6px;cursor:pointer;border-radius:0;transform:rotate(45deg)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;background:var(--ox);border:2px solid var(--card);cursor:pointer;border-radius:0}
.xp-read{font-size:.9rem;border-top:1px solid var(--rule);margin-top:1rem;padding-top:.8rem}
.xp-read .hd{font-family:var(--mono);font-size:.62rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-bottom:.35rem}
.xp-v{font-family:var(--disp);font-size:1.35rem;font-weight:800;line-height:1.2}
.xp-v.good{color:var(--moss)} .xp-v.warn{color:var(--ochre)} .xp-v.bad{color:var(--ox)}
.xp svg{width:100%;height:auto;display:block;background:var(--card)}
.xp-key{display:flex;gap:1rem;flex-wrap:wrap;font-family:var(--mono);font-size:.66rem;color:var(--ink2);margin-top:.4rem}
.xp-key i{display:inline-block;width:14px;height:3px;margin-right:.35rem;vertical-align:.22em}
.xp-foot{font-size:.83rem;color:var(--ink3);padding:.7rem 1.1rem;border-top:1px solid var(--rule);background:var(--sunk)}

figure{margin:1.2rem 0;padding:0}
figure svg{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--rule)}
figcaption{font-size:.8rem;color:var(--ink2);margin-top:.4rem;font-style:italic}
figcaption b{font-style:normal;font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ox);font-weight:400}
svg.spark{width:100%;height:auto;max-width:640px;margin-top:.5rem;background:var(--card);border:1px solid var(--rule)}

.ref{border-bottom:1px solid var(--rule);padding:.7rem 0;font-size:.87rem}
.ref:last-of-type{border-bottom:0}
.ref .loc{display:flex;gap:.4rem;align-items:center;margin-top:.35rem;flex-wrap:wrap}
.ref .loc input{max-width:250px;font-size:.76rem;padding:.18rem .35rem}
.ref .lk{font-family:var(--mono);font-size:.68rem}
.gl{border-bottom:1px solid var(--rule);padding:.55rem 0}
.gl .sym{font-family:'Spectral',Georgia,serif;font-style:italic;font-size:1.15rem;margin-right:.55rem;color:var(--ox)}

/* ---- author / colophon ---- */
.author{border-top:2px solid var(--ink);background:var(--card);margin-top:2rem}
.author-in{max-width:1360px;margin:0 auto;padding:1.5rem 1.1rem 2.5rem;
  display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:2rem}
@media(max-width:760px){.author-in{grid-template-columns:1fr;gap:1.2rem}}
.author h3{margin-top:0;border-bottom:0;font-size:1.15rem;font-family:var(--disp);font-weight:800}
.author .role{font-size:.9rem;color:var(--ink2);margin-bottom:.15rem}
.author .links{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem}
.author .links a{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--ink2);padding:.32rem .6rem;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:.4rem}
.author .links a:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.author .links a svg{width:13px;height:13px}
.author .colo{font-size:.83rem;color:var(--ink3)}
.foot{max-width:1360px;margin:0 auto;padding:1rem 1.1rem 2.5rem;color:var(--ink3);font-size:.78rem}

/* ---- home ---- */
.hero{padding:2.6rem 0 1.6rem;border-bottom:2px solid var(--ink);margin-bottom:1.8rem}
.hero h1{font-size:2.7rem;max-width:20ch;margin-bottom:.35rem}
@media(max-width:600px){.hero h1{font-size:1.9rem}}
.hero .sub{font-size:1.12rem;color:var(--ink2);max-width:62ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:1.2rem;margin:1.5rem 0}
.card2{border:1px solid var(--rule);border-top:3px solid var(--ox);background:var(--card);padding:1.2rem 1.3rem;text-decoration:none;color:var(--ink);display:block}
.card2:hover{border-top-color:var(--ink);box-shadow:4px 4px 0 var(--rule)}
.card2 h3{margin-top:0;border-bottom:0;font-family:var(--disp);font-weight:800}
.card2 .cnt{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-top:.7rem}
.card2 ul{font-size:.9rem;color:var(--ink2);margin-bottom:0}

@media print{.mast,.tabbar,.xp-ctrl{display:none!important}.tabpanel{display:block!important}body{background-image:none}body.plain .deep{display:block}}

</style>
</head>

  }
  return x>0?1-c:c;
}

      b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01],

      d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00],pl=0.02425,q,r,x;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));x=(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  else if(p<=1-pl){q=p-0.5;r=q*q;x=(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
  else {q=Math.sqrt(-2*Math.log(1-p));x=-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}

var sq=function(x){return x*x;};
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};

function val(id){var e=document.getElementById(id);return e?parseFloat(e.value):NaN;}
function wire(ids,fn){ids.forEach(function(i){var e=document.getElementById(i);if(e){e.oninput=fn;e.onchange=fn;}});fn();}
function twoProp(p1,p2,k,alpha,power,cc){
  var dlt=Math.abs(p1-p2); if(dlt<1e-12||!(p1>0&&p1<1&&p2>0&&p2<1)) return null;

/* ============================================================
   Tabs
   ============================================================ */
function buildTabs(TABS, SECTIONS, EXPLORERS){
  var byId={}; SECTIONS.forEach(function(s){byId[s.id]=s;});
  var bar='', panes='';
  TABS.forEach(function(t,i){
    bar+='<button class="tab'+(i===0?' on':'')+'" data-t="'+t.key+'"><span class="n">'+
         String(i+1).padStart(2,'0')+'</span>'+esc(t.label)+'</button>';
    var inner='';
    t.sections.forEach(function(sid){
      var s=byId[sid]; if(!s) return;
      inner+='<section id="'+s.id+'"><span class="kicker">'+esc(t.label)+' &nbsp;/&nbsp; '+esc(s.nav)+'</span><h1>'+s.title+'</h1>'+s.html+'</section>';
    });
    (EXPLORERS||[]).filter(function(x){return x.tab===t.key;}).forEach(function(x){
      inner+='<div class="xp" id="xp-'+x.id+'"></div>';
    });
    panes+='<div class="tabpanel'+(i===0?' on':'')+'" data-t="'+t.key+'">'+inner+'</div>';
  });
  $('#tabbar').innerHTML=bar;
  $('#panes').innerHTML=panes;
  $$('.tab').forEach(function(b){
    b.onclick=function(){
      $$('.tab').forEach(function(x){x.classList.toggle('on',x===b);});
      $$('.tabpanel').forEach(function(p){p.classList.toggle('on',p.dataset.t===b.dataset.t);});
      history.replaceState(null,'','#'+b.dataset.t);
      window.scrollTo({top:0,behavior:'instant'});
      XP.redrawAll();
    };
  });
  var h=(location.hash||'').replace('#','');
  if(h){
    var hit=$$('.tab').filter(function(b){return b.dataset.t===h;})[0];
    if(hit) hit.click();
    else { var sec=document.getElementById(h);
      if(sec){ var pane=sec.closest('.tabpanel');
        if(pane){ var tb=$$('.tab').filter(function(b){return b.dataset.t===pane.dataset.t;})[0];
          if(tb){tb.click(); setTimeout(function(){sec.scrollIntoView();},60);} } } }
  }
}

/* ============================================================
   Explorer framework — sliders driving a live SVG plot
   ============================================================ */
var XP=(function(){
  var reg=[];
  function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#888'; }
  function fmtNum(x){
    if(!isFinite(x)) return '—';
    var a=Math.abs(x);
    if(a>=10000) return Math.round(x).toLocaleString();
    if(a>=100) return x.toFixed(0);
    if(a>=10) return x.toFixed(1);
    if(a>=1) return x.toFixed(2);
    return x.toFixed(3);
  }
  function plot(spec,res){
    var narrow=(window.innerWidth||900)<760;
    var W=narrow?430:680, H=narrow?250:300, L=narrow?46:58, R=narrow?10:16, T=16, B=narrow?40:44;
    var FS=narrow?12.5:10, FL=narrow?13:10.5;
    var xs=[],ys=[];
    res.series.forEach(function(s){ s.pts.forEach(function(p){xs.push(p[0]);ys.push(p[1]);}); });
    if(!xs.length) return '<div class="note bad">No plottable values at these settings.</div>';
    var x0=(res.xMin!==undefined)?res.xMin:Math.min.apply(null,xs);
    var x1=(res.xMax!==undefined)?res.xMax:Math.max.apply(null,xs);
    var y0=(res.yMin!==undefined)?res.yMin:Math.min.apply(null,ys);
    var y1=(res.yMax!==undefined)?res.yMax:Math.max.apply(null,ys);
    if(y1<=y0) y1=y0+1;
    if(x1<=x0) x1=x0+1;
    var SX=function(x){return L+(x-x0)/(x1-x0)*(W-L-R);};
    var SY=function(y){return H-B-(y-y0)/(y1-y0)*(H-B-T);};
    var s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img">';
    /* gridlines */
    for(var g=0;g<=4;g++){
      var yv=y0+(y1-y0)*g/4, xv=x0+(x1-x0)*g/4;
      s+='<line x1="'+L+'" y1="'+SY(yv).toFixed(1)+'" x2="'+(W-R)+'" y2="'+SY(yv).toFixed(1)+'" stroke="'+css('--rule')+'" stroke-width="1"/>';
      s+='<text x="'+(L-7)+'" y="'+(SY(yv)+4).toFixed(1)+'" text-anchor="end" font-size="'+FS+'" fill="'+css('--ink3')+'" font-family="IBM Plex Mono,monospace">'+(res.yFmt?res.yFmt(yv):fmtNum(yv))+'</text>';
      s+='<text x="'+SX(xv).toFixed(1)+'" y="'+(H-B+16)+'" text-anchor="middle" font-size="'+FS+'" fill="'+css('--ink3')+'" font-family="IBM Plex Mono,monospace">'+(res.xFmt?res.xFmt(xv):fmtNum(xv))+'</text>';
    }
    /* reference bands / lines */
    (res.rules||[]).forEach(function(r){
      if(r.y!==undefined && r.y>=y0 && r.y<=y1)
        s+='<line x1="'+L+'" y1="'+SY(r.y).toFixed(1)+'" x2="'+(W-R)+'" y2="'+SY(r.y).toFixed(1)+'" stroke="'+css(r.color||'--ink3')+'" stroke-width="1.4" stroke-dasharray="5 4"/>'+
           '<text x="'+(W-R-4)+'" y="'+(SY(r.y)-5).toFixed(1)+'" text-anchor="end" font-size="'+FS+'" fill="'+css(r.color||'--ink3')+'" font-family="IBM Plex Mono,monospace">'+esc(r.lab||'')+'</text>';
      if(r.x!==undefined && r.x>=x0 && r.x<=x1)
        s+='<line x1="'+SX(r.x).toFixed(1)+'" y1="'+T+'" x2="'+SX(r.x).toFixed(1)+'" y2="'+(H-B)+'" stroke="'+css(r.color||'--ink3')+'" stroke-width="1.4" stroke-dasharray="5 4"/>';
    });
    /* series */
    res.series.forEach(function(ser){
      var d=ser.pts.filter(function(p){return isFinite(p[1]);})
        .map(function(p,i){return (i?'L':'M')+SX(p[0]).toFixed(1)+','+Math.max(T-30,Math.min(H-B+30,SY(p[1]))).toFixed(1);}).join(' ');
      s+='<path d="'+d+'" fill="none" stroke="'+css(ser.color||'--ox')+'" stroke-width="'+(ser.w||2.2)+'"'+
         (ser.dash?' stroke-dasharray="6 4"':'')+' stroke-linejoin="round"/>';
    });
    /* current-value marker */
    (res.marks||[]).forEach(function(mk){
      if(mk.x<x0||mk.x>x1) return;
      var cy=Math.max(T,Math.min(H-B,SY(mk.y)));
      s+='<line x1="'+SX(mk.x).toFixed(1)+'" y1="'+T+'" x2="'+SX(mk.x).toFixed(1)+'" y2="'+(H-B)+'" stroke="'+css('--ink')+'" stroke-width="1" opacity="0.45"/>'+
         '<circle cx="'+SX(mk.x).toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="5" fill="'+css('--ink')+'"/>'+
         '<circle cx="'+SX(mk.x).toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="2" fill="'+css('--card')+'"/>';
      if(mk.lab) s+='<text x="'+(SX(mk.x)+9).toFixed(1)+'" y="'+(cy-8).toFixed(1)+'" font-size="'+FL+'" fill="'+css('--ink')+'" font-family="IBM Plex Mono,monospace">'+esc(mk.lab)+'</text>';
    });
    s+='<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" stroke="'+css('--ink')+'" stroke-width="1.4"/>';
    s+='<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'" stroke="'+css('--ink')+'" stroke-width="1.4"/>';
    s+='<text x="'+((L+W-R)/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="'+FL+'" fill="'+css('--ink2')+'" font-family="IBM Plex Mono,monospace">'+esc(res.xLab||'')+'</text>';
    s+='<text x="3" y="'+(FL+1)+'" font-size="'+FL+'" fill="'+css('--ink2')+'" font-family="IBM Plex Mono,monospace">'+esc(res.yLab||'')+'</text>';
    s+='</svg>';
    var key=res.series.filter(function(x){return x.name;}).map(function(x){
      return '<span><i style="background:'+css(x.color||'--ox')+'"></i>'+esc(x.name)+'</span>';}).join('');
    return s+(key?'<div class="xp-key">'+key+'</div>':'');
  }
  function render(spec){
    var host=document.getElementById('xp-'+spec.id); if(!host) return;
    var v={}; spec.sliders.forEach(function(s){v[s.k]=(spec._v&&spec._v[s.k]!==undefined)?spec._v[s.k]:s.def;});
    spec._v=v;
    var ctrl=spec.sliders.map(function(s){
      return '<div class="sl"><div class="lab"><span>'+esc(s.lab)+'</span><b id="lv-'+spec.id+'-'+s.k+'">'+
        (s.fmt?s.fmt(v[s.k]):v[s.k])+'</b></div>'+
        '<input type="range" id="sl-'+spec.id+'-'+s.k+'" min="'+s.min+'" max="'+s.max+'" step="'+s.step+'" value="'+v[s.k]+'"></div>';
    }).join('');
    host.innerHTML='<div class="xp-head"><span class="tag">Explore</span><span class="ttl">'+esc(spec.title)+'</span></div>'+
      '<div class="xp-body"><div class="xp-blurb">'+spec.blurb+'</div>'+
      '<div class="xp-grid"><div id="pl-'+spec.id+'"></div>'+
      '<div class="xp-ctrl">'+ctrl+'<div class="xp-read" id="rd-'+spec.id+'"></div></div></div></div>'+
      (spec.foot?'<div class="xp-foot">'+spec.foot+'</div>':'');
    spec.sliders.forEach(function(s){
      var el=document.getElementById('sl-'+spec.id+'-'+s.k);
      el.oninput=function(){
        spec._v[s.k]=parseFloat(el.value);
        document.getElementById('lv-'+spec.id+'-'+s.k).textContent=s.fmt?s.fmt(spec._v[s.k]):spec._v[s.k];
        draw(spec);
      };
    });
    draw(spec);
  }
  function draw(spec){
    var res;
    try{ res=spec.compute(spec._v); }catch(e){ res=null; }
    var pl=document.getElementById('pl-'+spec.id), rd=document.getElementById('rd-'+spec.id);
    if(!pl) return;
    if(!res||res.error){
      var msg=(res&&res.error)?res.error:'Those settings are outside the range this model can represent.';
      pl.innerHTML='<div class="note bad" style="margin:0">'+msg+'</div>';
      if(rd) rd.innerHTML='<div class="hd">Not computable</div><div class="xp-v warn">\u2014</div>'+
        '<div style="margin-top:.45rem;color:var(--ink2);font-size:.86rem">Move a slider back into a feasible range.</div>';
      return;
    }
    pl.innerHTML=plot(spec,res);
    if(rd) rd.innerHTML='<div class="hd">'+esc(res.readHead||'At these settings')+'</div>'+
      '<div class="xp-v '+(res.verdict||'')+'">'+res.readValue+'</div>'+
      '<div style="margin-top:.45rem;color:var(--ink2);font-size:.86rem">'+res.readNote+'</div>';
  }
  var rz=null;
  window.addEventListener('resize',function(){
    clearTimeout(rz);
    rz=setTimeout(function(){ reg.forEach(function(sp){ if(document.getElementById('pl-'+sp.id)) draw(sp); }); },220);
  });
  return {
    add:function(spec){reg.push(spec);},
    renderAll:function(){reg.forEach(render);},
    redrawAll:function(){reg.forEach(function(s){ if(document.getElementById('pl-'+s.id)) draw(s); });},
    list:function(){return reg;}
  };
})();

/* ============================================================

function renderRefs(REFS, order, heads, hostSel, btnSel){
  var LOC={}, host=$(hostSel); if(!host) return;
  var h='';
  order.forEach(function(k){
    var r=REFS[k]; if(!r) return;
    if(heads[k]) h+='<h3>'+heads[k]+'</h3>';
    h+='<div class="ref"><span class="pill '+(r.checked?'ok">verified':'check">check')+'</span>'+
       '<b>'+esc(r.a)+'</b> ('+r.y+'). '+esc(r.t)+'. <em>'+esc(r.s)+'</em>.'+
       '<div style="color:var(--ink2);font-size:.87rem;margin-top:.3rem">'+esc(r.why)+'</div>'+
       '<div class="loc"><label style="margin:0;font-size:.72rem">Locator</label><input data-ref="'+k+'" placeholder="e.g. p. 27, eqn 4.3">'+
       (r.link?'<a class="lk" href="'+r.link+'" target="_blank" rel="noopener">source &#8599;</a>':'')+'</div></div>';
  });
  host.innerHTML=h;
  $$(hostSel+' input[data-ref]').forEach(function(i){i.oninput=function(){LOC[i.dataset.ref]=i.value;};});
  var btn=$(btnSel); if(btn) btn.onclick=function(){
    var out=order.map(function(k,i){var r=REFS[k];return r?((i+1)+'. '+r.a+'. '+r.t+'. '+r.s+'.'+(LOC[k]?' '+LOC[k]+'.':'')):'';}).filter(Boolean).join('\n');
    if(navigator.clipboard) navigator.clipboard.writeText(out);
    else{var ta=document.createElement('textarea');ta.value=out;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
    this.textContent='Copied'; var b=this; setTimeout(function(){b.textContent='Copy the reference list';},1600);
  };
}

<script>
/* ============================================================
   PITFALL EXPLORERS
   Each one takes a single pitfall and lets you drag it until you
   can see what it does to the answer.
   ============================================================ */
var pct=function(x){return (x*100).toFixed(0)+'%';};
var pct1=function(x){return (x*100).toFixed(1)+'%';};
var f2=function(x){return x.toFixed(2);};
var f1=function(x){return x.toFixed(1);};
var f0=function(x){return String(Math.round(x));};
var EXPLORERS=[];

/* ---------- 1. Precision buys badly (foundations) ---------- */
EXPLORERS.push({id:'precision',tab:'found',
 title:'Why precision is so expensive',
 blurb:'A confidence interval narrows with the <b>square root</b> of the sample. Drag the precision you want and watch the cost. This single curve explains more disappointing budget meetings than any other fact in study design.',
 sliders:[
  {k:'p',lab:'Anticipated prevalence',min:0.02,max:0.5,step:0.01,def:0.15,fmt:pct},
  {k:'d',lab:'Precision you want (± points)',min:0.005,max:0.10,step:0.005,def:0.03,fmt:function(x){return (x*100).toFixed(1);}}
 ],
 compute:function(v){
  var z=qnorm(0.975), pts=[];
  for(var d=0.005;d<=0.105;d+=0.0025) pts.push([d*100, sq(z)*v.p*(1-v.p)/sq(d)]);
  var n=sq(z)*v.p*(1-v.p)/sq(v.d);
  var half=sq(z)*v.p*(1-v.p)/sq(v.d/2);
  return {series:[{name:'Sample required',pts:pts,color:'--ox'}],
   xLab:'PRECISION ± PERCENTAGE POINTS', yLab:'SAMPLE SIZE', xMin:0, xMax:10, yMin:0,
   marks:[{x:v.d*100,y:n,lab:Math.ceil(n).toLocaleString()}],
   readHead:'Sample required', readValue:Math.ceil(n).toLocaleString(),
   verdict:n>3000?'bad':(n>800?'warn':'good'),
   readNote:'Halving your interval to ±'+((v.d/2)*100).toFixed(2)+' points would need <b>'+Math.ceil(half).toLocaleString()+
     '</b> — four times as many people for twice the precision. That factor of four is not negotiable; it is what the square root in the standard error does.'};
 },
 foot:'Simple random sampling, 95% confidence. Multiply by a design effect for clustered sampling and divide by expected response.'});

/* ---------- 2. Odds ratio vs risk ratio ---------- */
EXPLORERS.push({id:'orrr',tab:'cc',
 title:'When the odds ratio stops approximating the risk ratio',
 blurb:'Cornfield\'s approximation holds when the outcome is rare. Drag the baseline risk to the right and watch the two measures separate. Every point where the coloured curve sits above the dashed line is an overstatement waiting to be quoted as a risk ratio.',
 sliders:[{k:'or',lab:'Odds ratio you would report',min:1.1,max:6,step:0.1,def:3,fmt:f1}],
 compute:function(v){
  var rr=[],flat=[],p;
  for(p=0.002;p<=0.6;p+=0.004){ rr.push([p*100, v.or/((1-p)+p*v.or)]); flat.push([p*100, v.or]); }
  var mkp=0.30, mk=v.or/((1-mkp)+mkp*v.or);
  return {series:[
    {name:'Odds ratio (what you report)',pts:flat,color:'--ink3',dash:true,w:1.6},
    {name:'True risk ratio',pts:rr,color:'--ox'}],
   xLab:'BASELINE RISK IN THE UNEXPOSED (%)', yLab:'RATIO', xMin:0,xMax:60,yMin:1,
   rules:[{y:1,lab:'no effect',color:'--ink3'}],
   marks:[{x:mkp*100,y:mk,lab:'RR '+mk.toFixed(2)}],
   readHead:'At 30% baseline risk',
   readValue:'RR '+mk.toFixed(2),
   verdict:(v.or-mk)/mk>0.35?'bad':((v.or-mk)/mk>0.15?'warn':'good'),
   readNote:'An odds ratio of '+v.or.toFixed(1)+' corresponds to a risk ratio of '+mk.toFixed(2)+
     ' — an overstatement of <b>'+Math.round((v.or-mk)/mk*100)+'%</b> if read as a risk ratio. At a 1% baseline the same odds ratio means RR '+
     (v.or/(0.99+0.01*v.or)).toFixed(2)+', which is why the approximation was safe for the rare cancers case–control studies were invented for.'};
 },
 foot:'Conversion: RR = OR / [(1 − p₀) + p₀·OR]. Density and case-base control sampling avoid this problem entirely by estimating the rate ratio or risk ratio directly.'});

/* ---------- 3. Exposure misclassification ---------- */
EXPLORERS.push({id:'misclass',tab:'cc',
 title:'Misclassified exposure drags every effect towards the null',
 blurb:'Self-reported exposure is never perfectly measured. If the errors are the same in cases and controls, the observed odds ratio is <b>always</b> pulled towards 1 — never away. Drag sensitivity and specificity and watch a real effect disappear.',
 sliders:[
  {k:'or',lab:'True odds ratio',min:1.2,max:5,step:0.1,def:2.5,fmt:f1},
  {k:'p0',lab:'True exposure among controls',min:0.02,max:0.6,step:0.01,def:0.20,fmt:pct},
  {k:'sp',lab:'Specificity of measurement',min:0.70,max:1,step:0.01,def:0.95,fmt:pct}
 ],
 compute:function(v){
  function obs(se,sp){
    var p1=v.or*v.p0/(1+v.p0*(v.or-1));
    var a=p1*se+(1-p1)*(1-sp), b=v.p0*se+(1-v.p0)*(1-sp);
    if(a<=0||a>=1||b<=0||b>=1) return NaN;
    return (a/(1-a))/(b/(1-b));
  }
  var s1=[],s2=[],s3=[];
  for(var se=0.55;se<=1.0001;se+=0.01){
    s1.push([se*100, obs(se,v.sp)]);
    s2.push([se*100, obs(se,1)]);
    s3.push([se*100, obs(se,0.85)]);
  }
  var cur=obs(0.80,v.sp);
  if(!isFinite(cur)) return null;
  var lost=(v.or-cur)/(v.or-1);
  var nTrue=twoProp(v.p0, v.or*v.p0/(1+v.p0*(v.or-1)),1,0.05,0.8,true);
  var p1o=0.80*(v.or*v.p0/(1+v.p0*(v.or-1)))+(1-(v.or*v.p0/(1+v.p0*(v.or-1))))*(1-v.sp);
  var p0o=0.80*v.p0+(1-v.p0)*(1-v.sp);
  var nObs=twoProp(p0o,p1o,1,0.05,0.8,true);
  return {series:[
    {name:'Perfect specificity (100%)',pts:s2,color:'--moss',w:1.7},
    {name:'Your specificity',pts:s1,color:'--ox'},
    {name:'Specificity 85%',pts:s3,color:'--sea',w:1.7,dash:true}],
   xLab:'SENSITIVITY OF EXPOSURE MEASUREMENT (%)', yLab:'OBSERVED ODDS RATIO',
   xMin:55,xMax:100,yMin:1,yMax:Math.max(v.or*1.05,1.5),
   rules:[{y:v.or,lab:'true OR '+v.or.toFixed(1),color:'--ink3'},{y:1,lab:'null',color:'--ink3'}],
   marks:[{x:80,y:cur,lab:cur.toFixed(2)}],
   readHead:'At 80% sensitivity',
   readValue:'OR '+cur.toFixed(2),
   verdict:lost>0.4?'bad':(lost>0.2?'warn':'good'),

/* ---------- 4. Matching costs sample size ---------- */
EXPLORERS.push({id:'matching',tab:'cc',
 title:'Matching does not save sample size — it costs it',
 blurb:'A matched analysis discards every pair where case and control had the same exposure. The better your matching works on something related to the exposure, the fewer informative pairs survive. Drag φ and watch the study grow.',
 sliders:[
  {k:'p0',lab:'Exposure among controls',min:0.05,max:0.50,step:0.01,def:0.20,fmt:pct},
  {k:'or',lab:'Odds ratio to detect',min:1.3,max:3.5,step:0.1,def:2,fmt:f1}
 ],
 compute:function(v){
  function cells(p0,psi,phi){
    function cel(x){var p01=p0-x,p10=psi*p01,p1=x+p10,p00=1-x-p10-p01;return{p11:x,p10:p10,p01:p01,p00:p00,p1:p1};}
    function corr(x){var c=cel(x); if(!(c.p1>0&&c.p1<1))return NaN;
      return (c.p11-c.p1*p0)/Math.sqrt(c.p1*(1-c.p1)*p0*(1-p0));}
    var lo=1e-9,hi=p0-1e-9,st=p0/600;
    for(var i=0;i<600&&hi>lo;i++){var c=cel(hi); if(c.p00>=0&&c.p1>0&&c.p1<1&&!isNaN(corr(hi)))break; hi-=st;}
    for(var i2=0;i2<600&&lo<hi;i2++){var c2=cel(lo); if(c2.p00>=0&&c2.p1>0&&c2.p1<1&&!isNaN(corr(lo)))break; lo+=st;}
    if(hi<=lo) return null;
    var clo=corr(lo), chi=corr(hi);
    if(isNaN(clo)||isNaN(chi)) return null;
    if(phi<clo-1e-6||phi>chi+1e-6) return null;
    for(var j=0;j<120;j++){var m=(lo+hi)/2; if(corr(m)<phi) lo=m; else hi=m;}

  }

    return sq(qnorm(0.975)*Math.sqrt(pd)+qnorm(0.8)*Math.sqrt(pd-sq(dd)))/sq(dd);
  }
  var np=[],inf=[];
  for(var phi=0;phi<=0.75;phi+=0.02){ var n=pairs(phi); if(isFinite(n)){ np.push([phi,n]); var c=cells(v.p0,v.or,phi); inf.push([phi,(c.p10+c.p01)*100]); } }
  if(!np.length) return {error:'With '+pct(v.p0)+' exposure among controls and an odds ratio of '+v.or.toFixed(1)+
    ', the implied exposure prevalence among cases exceeds 100%. That combination cannot occur. Lower one of the two sliders.'};
  var base=pairs(0), cur=pairs(0.2);
  if(!isFinite(base)||!isFinite(cur)) return {error:'No feasible matched design at this combination of exposure prevalence and odds ratio.'};
  var unm=twoProp(v.p0, v.or*v.p0/(1+v.p0*(v.or-1)),1,0.05,0.8,true);
  return {series:[{name:'Matched pairs required',pts:np,color:'--ox'}],
   xLab:'φ — EXPOSURE CORRELATION BETWEEN CASE AND ITS MATCHED CONTROL', yLab:'PAIRS REQUIRED',
   xMin:0,xMax:0.75,yMin:0,
   rules:[{y:unm,lab:'unmatched: '+Math.ceil(unm)+' cases',color:'--sea'}],
   marks:[{x:0.2,y:cur,lab:Math.ceil(cur).toLocaleString()}],
   xFmt:function(x){return x.toFixed(2);},
   readHead:'At φ = 0.2 (Dupont\'s default)',
   readValue:Math.ceil(cur).toLocaleString()+' pairs',
   verdict:cur/base>1.5?'bad':(cur/base>1.15?'warn':'good'),
   readNote:'At φ = 0 matching costs nothing and you would need '+Math.ceil(base)+' pairs. At φ = 0.2 you need <b>'+
     Math.ceil(cur)+'</b> — '+Math.round((cur/base-1)*100)+'% more. Match on something closely tied to the exposure and φ climbs well past 0.4, where the trial has roughly doubled.'};
 },
 foot:'Dupont\'s parameterisation with the conditional odds ratio held fixed; Connor\'s formula for McNemar\'s test. Match because you need confounding controlled and cannot get at it another way — then pay for it knowingly. Never match on anything the exposure could plausibly cause.'});

/* ---------- 9. Stepped wedge: omitted secular trend ---------- */
EXPLORERS.push({id:'swtrend',tab:'sw',
 title:'Stepped wedge: what happens if you omit period effects',
 blurb:'In a stepped wedge, later periods contain more intervention clusters, so time and treatment are structurally confounded. Leave period effects out of the model and any background change gets credited to your intervention. The trend below is measured <b>in the direction your intervention is meant to push the outcome</b>, so a positive value means the world was already moving your way.',
 sliders:[
  {k:'K',lab:'Number of steps',min:2,max:10,step:1,def:5,fmt:f0},
  {k:'eff',lab:'True intervention effect (points)',min:0,max:10,step:0.5,def:5,fmt:f1}
 ],
 compute:function(v){
  var K=Math.round(v.K), T=K+1, I=K*2, per=I/K;
  /* build design matrix: for each cluster i (step s), period j=0..K */
  var X=[],J=[];
  for(var s=1;s<=K;s++) for(var c=0;c<per;c++) for(var j=0;j<T;j++){ X.push(j>=s?1:0); J.push(j); }
  var n=X.length, mx=0,mj=0;
  for(var i=0;i<n;i++){mx+=X[i];mj+=J[i];} mx/=n; mj/=n;
  var cov=0,vx=0;
  for(var i2=0;i2<n;i2++){cov+=(J[i2]-mj)*(X[i2]-mx); vx+=sq(X[i2]-mx);}
  var slope=cov/vx;   /* bias per unit of trend when time is omitted */
  var naive=[],correct=[];
  for(var tr=-2;tr<=2.001;tr+=0.05){
    naive.push([tr, v.eff + tr*slope]);
    correct.push([tr, v.eff]);
  }
  var curTrend=1, cur=v.eff+curTrend*slope;
  return {series:[
    {name:'Model WITH period effects',pts:correct,color:'--moss'},
    {name:'Model WITHOUT period effects',pts:naive,color:'--ox'}],
   xLab:'BACKGROUND TREND PER PERIOD, IN THE DIRECTION THE INTERVENTION WORKS', yLab:'ESTIMATED EFFECT',
   xMin:-2,xMax:2,
   rules:[{y:v.eff,lab:'truth',color:'--ink3'},{y:0,lab:'no effect',color:'--ink3'}],
   marks:[{x:curTrend,y:cur,lab:cur.toFixed(1)}],
   xFmt:function(x){return x.toFixed(1);},
   readHead:'If the world moves 1 point per period your way',
   readValue:cur.toFixed(1)+' vs '+v.eff.toFixed(1),
   verdict:Math.abs(cur-v.eff)/Math.max(v.eff,1)>0.4?'bad':'warn',
   readNote:'Omitting period effects inflates the estimate to <b>'+cur.toFixed(1)+'</b> against a truth of '+v.eff.toFixed(1)+
     '. The bias is exactly the trend multiplied by <b>'+slope.toFixed(2)+'</b>, a fixed property of this design\u2019s geometry \u2014 it does not shrink as you recruit more. '+
     'Set the true effect slider to zero and the naive model still reports '+(1*slope).toFixed(1)+' points of \u201Cbenefit\u201D that is <b>entirely</b> secular change. '+
     'Drag the trend negative and the same mechanism buries a real effect instead. This is why period effects are not optional in a stepped wedge.'};
 },
 foot:'Bias computed exactly as trend × Cov(period, treatment) / Var(treatment) over the complete design matrix. Note the green line is flat: with period effects in the model the estimate is unbiased whatever the trend. What period effects cannot absorb is a <b>shock</b> that hits clusters differently — a pandemic, a stockout, a guideline change mid-rollout.'});

/* ---------- 10. Stepped wedge: lagged effect ---------- */
EXPLORERS.push({id:'swlag',tab:'sw',
 title:'Stepped wedge: the effect that takes months to arrive',
 blurb:'Implementation is not a switch. Fidelity in month one is not fidelity in month twelve. The standard model assumes the full effect appears immediately; if it ramps up instead, the constant-effect estimate is an average that understates the effect you eventually achieve.',

 compute:function(v){
  var K=Math.round(v.K), T=K+1, per=2;
  function estimate(L){
    /* weights = share of intervention cluster-periods at each exposure time */
    var w={},tot=0;

  var pts=[],flat=[];

   readNote:'You would report about <b>'+cur.toFixed(0)+'%</b> of the effect the intervention actually delivers once established — and a trial powered for the full effect is now underpowered by that margin. '+
     'Fewer steps makes this worse, because clusters that cross late contribute only their weakest exposure periods.'};
 },
 foot:'Illustrative weighting: the constant-effect estimate is shown as the design-weighted average of exposure-time effects. <b>The exact weights under the Hussey–Hughes estimator differ and can even be negative in some configurations</b>, which can bias the estimate in directions that are not intuitive — see Kenny and colleagues (2022) in the sources. The practical response is the same either way: pre-specify a secondary model that lets the effect vary with time since crossover, and report both.'});

/* ---------- 11. Interim looks inflate alpha ---------- */
var ALPHA_SIM=(function(){
  var NS=8000, maxK=60, seed=20240917>>>0, spare=null;
  function rnd(){ seed|=0; seed=seed+0x6D2B79F5|0;
    var t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296; }
  function nr(){ if(spare!==null){var v=spare;spare=null;return v;}
    var u,w,s2; do{u=2*rnd()-1;w=2*rnd()-1;s2=u*u+w*w;}while(s2>=1||s2===0);
    var m=Math.sqrt(-2*Math.log(s2)/s2); spare=w*m; return u*m; }
  var P=null;
  function paths(){ if(P) return P;
    P=new Float64Array(NS*maxK);
    for(var s=0;s<NS;s++){ var acc=0; for(var j=0;j<maxK;j++){acc+=nr(); P[s*maxK+j]=acc;} }
    return P; }
  function alpha(k,c){
    var A=paths(), hit=0;
    for(var s=0;s<NS;s++){
      var base=s*maxK, rej=false;
      for(var j=1;j<=k;j++){
        var idx=Math.round(j*maxK/k)-1, t=(idx+1)/maxK;
        var Z=A[base+idx]/Math.sqrt(idx+1);
        var crit=(c===null)?1.96:c/Math.sqrt(t);
        if(Math.abs(Z)>crit){rej=true;break;}
      }
      if(rej) hit++;
    }
    return hit/NS;
  }
  function calib(k){ var lo=1.9,hi=4.0;
    for(var i=0;i<16;i++){var m=(lo+hi)/2; if(alpha(k,m)>0.05) lo=m; else hi=m;}
    return (lo+hi)/2; }
  var cache={naive:{},spend:{},c:{}};
  return {
    naive:function(k){ if(cache.naive[k]===undefined) cache.naive[k]=alpha(k,null); return cache.naive[k]; },
    spend:function(k){ if(cache.spend[k]===undefined){ var c=calib(k); cache.c[k]=c; cache.spend[k]=alpha(k,c);} return cache.spend[k]; },
    cOf:function(k){ if(cache.c[k]===undefined) this.spend(k); return cache.c[k]; }
  };
})();

 sliders:[{k:'looks',lab:'Number of analyses',min:1,max:20,step:1,def:5,fmt:f0}],
 compute:function(v){
  var naive=[],spend=[];
  for(var k=1;k<=20;k++){ naive.push([k,ALPHA_SIM.naive(k)*100]); spend.push([k,ALPHA_SIM.spend(k)*100]); }
  var K=Math.round(v.looks), cur=ALPHA_SIM.naive(K)*100, c=ALPHA_SIM.cOf(K);
  var finalP=2*(1-pnorm(c));
  return {series:[
    {name:'Nominal 0.05 at every look',pts:naive,color:'--ox'},
    {name:'Alpha-spending boundary',pts:spend,color:'--moss'}],
   xLab:'NUMBER OF ANALYSES PERFORMED', yLab:'ACTUAL FALSE-POSITIVE RATE (%)',
   xMin:1,xMax:20,yMin:0,yMax:30,
   rules:[{y:5,lab:'intended 5%',color:'--ink3'}],
   marks:[{x:K,y:cur,lab:cur.toFixed(1)+'%'}],
   xFmt:f0,
   readHead:'With '+K+' analysis'+(K>1?'es':''),
   readValue:cur.toFixed(1)+'%',
   verdict:cur>12?'bad':(cur>7?'warn':'good'),
   readNote:'Your actual type I error is <b>'+cur.toFixed(1)+'%</b>, not 5% \u2014 '+(cur/5).toFixed(1)+
     '\u00d7 what you intended. A boundary of the O\u2019Brien\u2013Fleming shape holds it at 5% throughout: at '+K+
     ' look'+(K>1?'s':'')+' the final analysis would use a nominal p-value of about <b>'+finalP.toFixed(3)+
     '</b> rather than 0.05, which is why the maximum sample size barely has to grow.'};
 },
 foot:'Simulated with a fixed seed over 8,000 Brownian paths, so the curve is reproducible. The red line reproduces the published repeated-significance values closely (0.083 at two looks, 0.142 at five, 0.193 at ten, 0.246 at twenty). The green boundary has the O\u2019Brien\u2013Fleming shape c/&radic;t with c calibrated <em>within this same simulation</em> so the overall rate is exactly 5% \u2014 it is not taken from a published table, so treat the constant as illustrative rather than as a design value. Separately: <b>trials stopped early for benefit systematically overestimate the effect</b>, because you stopped at a random high.'});

/* ---------- 12. Dilution from non-adherence ---------- */
EXPLORERS.push({id:'dilute',tab:'par',
 title:'Non-adherence and contamination: paying twice',
 blurb:'People in the intervention arm who do not take it, and people in the control arm who get it anyway, both pull the observed effect towards nothing. Intention-to-treat estimates the diluted effect — so you must power for the diluted effect, not the true one.',
 sliders:[
  {k:'p1',lab:'Control event rate',min:0.05,max:0.6,step:0.01,def:0.30,fmt:pct},
  {k:'p2',lab:'True intervention rate',min:0.02,max:0.55,step:0.01,def:0.20,fmt:pct}
 ],
 compute:function(v){
  if(v.p2>=v.p1) return null;
  var base=twoProp(v.p1,v.p2,1,0.05,0.8,true);
  function need(f){
    var obs2=v.p2+(v.p1-v.p2)*f;   /* f = fraction of the contrast lost */
    if(obs2>=v.p1-1e-6) return NaN;
    return twoProp(v.p1,obs2,1,0.05,0.8,true);
  }
  var pts=[];
  for(var f=0;f<=0.55;f+=0.01){ var n=need(f); if(isFinite(n)&&n<base*14) pts.push([f*100,n]); }
  var cur=need(0.2);
  return {series:[{name:'Required n per arm',pts:pts,color:'--ox'}],
   xLab:'SHARE OF THE TRUE CONTRAST LOST TO NON-ADHERENCE AND DROP-IN (%)', yLab:'PARTICIPANTS PER ARM',
   xMin:0,xMax:55,yMin:0,
   rules:[{y:base,lab:'perfect adherence: '+Math.ceil(base),color:'--moss'}],
   marks:[{x:20,y:cur,lab:Math.ceil(cur).toLocaleString()}],
   readHead:'Losing 20% of the contrast',
   readValue:Math.ceil(cur).toLocaleString()+' per arm',
   verdict:cur/base>1.8?'bad':(cur/base>1.3?'warn':'good'),
   readNote:'Requires <b>'+Math.ceil(cur).toLocaleString()+'</b> per arm against '+Math.ceil(base)+
     ' with perfect adherence — a factor of '+(cur/base).toFixed(2)+'×. The curve is steep because the effect sits in the denominator <em>squared</em>. '+
     'Note this is separate from loss to follow-up, which you also have to inflate for on top.'};
 },
 foot:'A 10% non-adherence rate plus 10% drop-in loses roughly 20% of the contrast. Protecting adherence during the trial is usually far cheaper than recruiting the extra participants. In a <b>non-inferiority</b> trial this dilution runs the other way — it pushes you towards the conclusion you wanted, which is why both ITT and per-protocol analyses must agree.'});

/* ---------- 13. ITS: how long a pre-period ---------- */
EXPLORERS.push({id:'itspre',tab:'impl',
 title:'Interrupted time series: how long a run-in do you need?',
 blurb:'The pre-intervention trend is your counterfactual. If it is estimated imprecisely, everything after the interruption is being compared against a guess. Drag the number of pre-period points and watch the uncertainty in that slope.',
 sliders:[
  {k:'sd',lab:'Noise in the outcome (SD per point)',min:1,max:15,step:0.5,def:5,fmt:f1},
  {k:'rho',lab:'Autocorrelation between adjacent points',min:0,max:0.8,step:0.05,def:0.3,fmt:f2}
 ],
 compute:function(v){
  function se(n){
    if(n<3) return NaN;
    var base=v.sd/Math.sqrt(n*(sq(n)-1)/12);
    return base*Math.sqrt((1+v.rho)/(1-v.rho));   /* inflation for AR(1) */
  }
  var pts=[],ind=[];
  for(var n=4;n<=60;n++){ pts.push([n,se(n)]); ind.push([n,v.sd/Math.sqrt(n*(sq(n)-1)/12)]); }
  var cur=se(12), at24=se(24), at48=se(48);
  return {series:[
    {name:'If points were independent',pts:ind,color:'--moss',w:1.6,dash:true},
    {name:'With your autocorrelation',pts:pts,color:'--ox'}],
   xLab:'NUMBER OF PRE-INTERVENTION TIME POINTS', yLab:'STANDARD ERROR OF THE PRE-TREND SLOPE',
   xMin:4,xMax:60,yMin:0,
   rules:[{x:12,color:'--ink3'}],
   marks:[{x:12,y:cur,lab:cur.toFixed(3)}],
   xFmt:f0,
   readHead:'With 12 pre-period points',
   readValue:'SE '+cur.toFixed(3),
   verdict:cur/at48>2.2?'bad':(cur/at48>1.5?'warn':'good'),
   readNote:'Doubling to 24 points cuts the standard error to '+at24.toFixed(3)+', and 48 points gives '+at48.toFixed(3)+
     '. The gain is steep early and then flattens, which is where the common guidance of around a dozen points either side comes from. '+
     'Your autocorrelation of '+v.rho.toFixed(2)+' inflates every one of these by <b>'+Math.sqrt((1+v.rho)/(1-v.rho)).toFixed(2)+
     '×</b> — ignore it in the model and your intervals will be that much too narrow.'};
 },
 foot:'Slope standard error for evenly spaced points is σ/√(n(n²−1)/12); the autocorrelation factor √((1+ρ)/(1−ρ)) is the standard AR(1) variance inflation for a mean-like statistic and is used here as an illustration of direction and magnitude, not as an exact result. There is no closed-form power calculation for an ITS worth trusting — simulate from your own pre-period data. This tells you whether that is worth attempting.'});

/* ---------- 14. Non-inferiority margin ---------- */
EXPLORERS.push({id:'nimargin',tab:'ni',
 title:'The non-inferiority margin is a scientific claim with a price tag',
 blurb:'A wider margin buys a smaller trial by accepting a weaker conclusion. Drag it and watch the cost. Then ask whether you could defend the margin to someone who would have to take the new treatment.',
 sliders:[
  {k:'pc',lab:'Control success rate',min:0.5,max:0.98,step:0.01,def:0.90,fmt:pct},
  {k:'pw',lab:'Power',min:0.8,max:0.95,step:0.05,def:0.90,fmt:pct}
 ],
 compute:function(v){
  function n(d){ return sq(qnorm(0.975)+qnorm(v.pw))*(2*v.pc*(1-v.pc))/sq(d); }
  var pts=[];
  for(var d=0.015;d<=0.12;d+=0.0025) pts.push([d*100,n(d)]);
  var cur=n(0.05), tight=n(0.03);
  return {series:[{name:'Participants per arm',pts:pts,color:'--ox'}],
   xLab:'NON-INFERIORITY MARGIN (PERCENTAGE POINTS)', yLab:'PARTICIPANTS PER ARM',
   xMin:1,xMax:12,yMin:0,
   marks:[{x:5,y:cur,lab:Math.ceil(cur).toLocaleString()}],
   xFmt:f1,
   readHead:'At a 5-point margin',
   readValue:Math.ceil(cur).toLocaleString()+' per arm',
   verdict:cur>1500?'bad':(cur>700?'warn':'good'),
   readNote:'Tightening the margin to 3 points raises this to <b>'+Math.ceil(tight).toLocaleString()+
     '</b> per arm — a '+(tight/cur).toFixed(1)+'× increase for two percentage points of rigour. '+
     'The margin must preserve a worthwhile fraction of the control treatment\'s own benefit over doing nothing; it is not a budget parameter.'};
 },
 foot:'One-sided α = 0.025, assuming the new treatment performs identically to the control. Assuming it performs <em>better</em> shrinks the trial substantially and is very hard to defend — if you could defend it, you would be running a superiority trial.'});

/* ---------- clone: design effect also appears under cross-sectional ---------- */
(function(){
  var base=EXPLORERS.filter(function(x){return x.id==='deff';})[0];
  if(!base) return;
  var clone={};
  Object.keys(base).forEach(function(k){clone[k]=base[k];});
  clone.id='deffxs'; clone.tab='xs';
  clone.title='Clustered sampling: bigger clusters stop helping';
  clone.blurb='Prevalence surveys almost never sample individuals at random \u2014 they sample villages, then households, then people. Drag the intracluster correlation and watch how little a large cluster is actually worth.';
  clone.sliders=base.sliders.map(function(s){var c={};Object.keys(s).forEach(function(k){c[k]=s[k];});return c;});
  EXPLORERS.push(clone);
})();

</script>
<script>
/* =========================================================
   TRIALS — reference registry
   checked:true = bibliographic details verified against PubMed,
   the publisher or an indexing service during the build.
   No page or equation numbers are supplied for books.
   ========================================================= */
var REFS={

/* --- foundations --- */
mrc1948:{a:"Medical Research Council",y:1948,t:"Streptomycin treatment of pulmonary tuberculosis: a Medical Research Council investigation",s:"British Medical Journal 1948;2(4582):769–782",checked:true,link:"https://pmc.ncbi.nlm.nih.gov/articles/PMC2091872/",
 why:"The first properly randomised controlled trial in the English-language medical literature, planned by the Streptomycin in Tuberculosis Trials Committee with Austin Bradford Hill as its statistician. Free full text at PubMed Central — read the allocation section, it is two paragraphs and it founded modern trial methodology."},
neymanpearson1933:{a:"Neyman J, Pearson ES",y:1933,t:"On the problem of the most efficient tests of statistical hypotheses",s:"Philosophical Transactions of the Royal Society of London, Series A 1933;231:289–337",checked:false,link:"https://royalsocietypublishing.org/",
 why:"Where α and β came from as a formal pair. Every sample size formula on this site applies this framework. Details not machine-verified in this build."},
hill1965:{a:"Hill AB",y:1965,t:"The environment and disease: association or causation?",s:"Proceedings of the Royal Society of Medicine 1965;58(5):295–300",checked:false,link:"https://pubmed.ncbi.nlm.nih.gov/14283879/",
 why:"Not a trials paper, but by the same author, and the clearest statement of why randomisation matters: it is the one device that addresses all the criteria at once. Details not machine-verified in this build."},
ichE9:{a:"International Council for Harmonisation",y:1998,t:"ICH E9: Statistical principles for clinical trials",s:"ICH Harmonised Tripartite Guideline",checked:false,link:"https://database.ich.org/sites/default/files/E9_Guideline.pdf",
 why:"The regulatory baseline. Estimands, analysis sets, multiplicity, interim analyses. Free. The 2019 addendum ICH E9(R1) on estimands is the more important document for modern protocols. Details not machine-verified in this build."},
consort2010:{a:"Schulz KF, Altman DG, Moher D, for the CONSORT Group",y:2010,t:"CONSORT 2010 Statement: updated guidelines for reporting parallel group randomised trials",s:"BMJ 2010;340:c332",checked:false,link:"https://www.equator-network.org/reporting-guidelines/consort/",
 why:"Item 7a asks how sample size was determined. Read the checklist backwards as a design document: anything you must report, you must first decide. Details not machine-verified in this build."},
spirit2013:{a:"Chan AW, Tetzlaff JM, Altman DG, et al.",y:2013,t:"SPIRIT 2013 Statement: defining standard protocol items for clinical trials",s:"Annals of Internal Medicine 2013;158(3):200–207",checked:false,link:"https://www.spirit-statement.org/",
 why:"The protocol counterpart to CONSORT. Details not machine-verified in this build."},
schulz2005:{a:"Schulz KF, Grimes DA",y:2005,t:"Sample size calculations in randomised trials: mandatory and mystical",s:"The Lancet 2005;365(9467):1348–1353",checked:false,link:"https://pubmed.ncbi.nlm.nih.gov/15823387/",
 why:"On how routinely the reported calculation is reverse-engineered from the sample that was affordable. Details not machine-verified in this build."},

/* --- core sample size methods --- */
lachin1981:{a:"Lachin JM",y:1981,t:"Introduction to sample size determination and power analysis for clinical trials",s:"Controlled Clinical Trials 1981;2(2):93–113",checked:true,link:"https://pubmed.ncbi.nlm.nih.gov/7273794/",
 why:"A unified derivation that covers most two-group cases. If you want one paper that shows where all the formulae come from rather than just what they are, this is it."},
fleiss1980:{a:"Fleiss JL, Tytun A, Ury HK",y:1980,t:"A simple approximation for calculating sample sizes for comparing independent proportions",s:"Biometrics 1980;36(2):343–346",checked:true,link:"https://pubmed.ncbi.nlm.nih.gov/26625475/",
 why:"The continuity-corrected two-proportion formula generalised to unequal allocation. The default engine behind most binary-outcome trial calculations."},
casagrande1978:{a:"Casagrande JT, Pike MC, Smith PG",y:1978,t:"An improved approximate formula for calculating sample sizes for comparing two binomial distributions",s:"Biometrics 1978;34(3):483–486",checked:true,link:"https://pubmed.ncbi.nlm.nih.gov/719120/",
 why:"The equal-allocation continuity correction Fleiss and colleagues then generalised."},
schoenfeld1983:{a:"Schoenfeld DA",y:1983,t:"Sample-size formula for the proportional-hazards regression model",s:"Biometrics 1983;39(2):499–503",checked:true,link:"https://pubmed.ncbi.nlm.nih.gov/6354290/",
 why:"Gives the number of EVENTS, not patients — the distinction most survival protocols get wrong. Handles unequal allocation naturally and underlies most software defaults."},
freedman1982:{a:"Freedman LS",y:1982,t:"Tables of the number of patients required in clinical trials using the logrank test",s:"Statistics in Medicine 1982;1(2):121–129",checked:true,link:"https://pubmed.ncbi.nlm.nih.gov/7187087/",
 why:"The alternative events formula, slightly more conservative when the hazard ratio is far from 1. When two calculators disagree on a survival trial, this is usually why."},
lakatos1988:{a:"Lakatos E",y:1988,t:"Sample sizes based on the logrank statistic in complex clinical trials",s:"Biometrics 1988;44(1):229–241",checked:true,link:"https://pubmed.ncbi.nlm.nih.gov/3358991/",
 why:"What to use when hazards are non-proportional, accrual is staggered, or there is meaningful drop-in and drop-out — that is, in almost every real trial."},
blackwelder1982:{a:"Blackwelder WC",y:1982,t:"'Proving the null hypothesis' in clinical trials",s:"Controlled Clinical Trials 1982;3(4):345–353",checked:true,link:"https://pubmed.ncbi.nlm.nih.gov/7160191/",
 why:"The paper that reframed equivalence testing and gave non-inferiority its logic: the null becomes 'the new treatment is worse by at least δ', and rejecting it is the finding."},
connor1987:{a:"Connor RJ",y:1987,t:"Sample size for testing differences in proportions for the paired-sample design",s:"Biometrics 1987;43(1):207–211",checked:true,link:"https://pubmed.ncbi.nlm.nih.gov/3567305/",
 why:"McNemar sample size — needed for crossover trials with binary outcomes and for matched designs."},
hayes1999:{a:"Hayes RJ, Bennett S",y:1999,t:"Simple sample size calculation for cluster-randomized trials",s:"International Journal of Epidemiology 1999;28(2):319–326",checked:true,link:"https://pubmed.ncbi.nlm.nih.gov/10342698/",
 why:"The coefficient-of-variation approach, with worked examples from a bednet trial in Kenya and an STD treatment trial in Tanzania. Gives clusters per arm directly, which is the quantity that constrains a real trial."},
hayes2017:{a:"Hayes RJ, Moulton LH",y:2017,t:"Cluster randomised trials",s:"2nd edition. Chapman & Hall/CRC, Boca Raton",checked:false,link:"https://www.routledge.com/",
 why:"The book-length treatment, including matched and stratified designs. Locator not supplied."},
donner2000:{a:"Donner A, Klar N",y:2000,t:"Design and analysis of cluster randomization trials in health research",s:"Arnold, London",checked:false,link:"",
 why:"The design-effect and intracluster-correlation route. Locator not supplied."},

/* --- stepped wedge and newer designs --- */
hussey2007:{a:"Hussey MA, Hughes JP",y:2007,t:"Design and analysis of stepped wedge cluster randomized trials",s:"Contemporary Clinical Trials 2007;28(2):182–191",checked:true,link:"https://pubmed.ncbi.nlm.nih.gov/16829207/",
 why:"The foundational paper. Sets out the linear mixed model with cluster random effects and fixed time effects, derives the variance of the treatment-effect estimator, and shows why the design gains efficiency from within-cluster comparison. Everything modern on stepped wedge extends this."},
woertman2013:{a:"Woertman W, de Hoop E, Moerbeek M, Zuidema SU, Gerritsen DL, Teerenstra S",y:2013,t:"Stepped wedge designs could reduce the required sample size in cluster randomized trials",s:"Journal of Clinical Epidemiology 2013;66(7):752–758",checked:false,link:"https://pubmed.ncbi.nlm.nih.gov/23523551/",
 why:"Source of the stepped-wedge design effect that lets you convert a parallel cluster trial size into a stepped-wedge one. Widely used and widely misapplied — it assumes the Hussey–Hughes model exactly. Details not machine-verified in this build."},
hemming2015:{a:"Hemming K, Haines TP, Chilton PJ, Girling AJ, Lilford RJ",y:2015,t:"The stepped wedge cluster randomised trial: rationale, design, analysis, and reporting",s:"BMJ 2015;350:h391",checked:true,link:"https://pubmed.ncbi.nlm.nih.gov/25662947/",
 why:"The best entry point: free full text, plain language, and honest about when the design is the right choice and when it is being used to dodge an ethical objection that should have been faced directly."},
hemmingConsort:{a:"Hemming K, Taljaard M, McKenzie JE, et al.",y:2018,t:"Reporting of stepped wedge cluster randomised trials: extension of the CONSORT 2010 statement with explanation and elaboration",s:"BMJ 2018;363:k1614",checked:false,link:"https://www.equator-network.org/",
 why:"The reporting standard. Read it while designing, not while writing up. Details not machine-verified in this build."},
copas2015:{a:"Copas AJ, Lewis JJ, Thompson JA, Davey C, Baio G, Hargreaves JR",y:2015,t:"Designing a stepped wedge trial: three main designs, carry-over effects and randomisation approaches",s:"Trials 2015;16:352",checked:false,link:"https://trialsjournal.biomedcentral.com/",
 why:"Distinguishes the cross-sectional, closed-cohort and open-cohort stepped wedge, which have different correlation structures and therefore different sample sizes. Most protocols never say which they are. Details not machine-verified in this build."},
hughes2015:{a:"Hughes JP, Granston TS, Heagerty PJ",y:2015,t:"Current issues in the design and analysis of stepped wedge trials",s:"Contemporary Clinical Trials 2015;45:55–60",checked:false,link:"https://pubmed.ncbi.nlm.nih.gov/26247569/",
 why:"The authors' own account of what the 2007 model gets wrong — chiefly the assumption that the treatment effect is immediate and constant. Details not machine-verified in this build."},
kenny2022:{a:"Kenny A, Voldal EC, Xia F, Heagerty PJ, Hughes JP",y:2022,t:"Analysis of stepped wedge cluster randomized trials in the presence of a time-varying treatment effect",s:"Statistics in Medicine 2022;41(22):4311–4339",checked:false,link:"https://pubmed.ncbi.nlm.nih.gov/35774016/",
 why:"Shows that if the effect ramps up with exposure time and you fit the constant-effect model, the estimate is biased — sometimes severely, and in a direction that is not obvious. The most important recent result for anyone running a stepped wedge. Details not machine-verified in this build."},
li2021:{a:"Li F, Hughes JP, Hemming K, Taljaard M, Melnick ER, Heagerty PJ",y:2021,t:"Mixed-effects models for the design and analysis of stepped wedge cluster randomized trials: an overview",s:"Statistical Methods in Medical Research 2021;30(2):612–639",checked:false,link:"https://pubmed.ncbi.nlm.nih.gov/32631142/",
 why:"The modern reference on correlation structures: exchangeable, nested exchangeable, exponential decay. Which you assume changes the sample size materially. Details not machine-verified in this build."},
pocock1977:{a:"Pocock SJ",y:1977,t:"Group sequential methods in the design and analysis of clinical trials",s:"Biometrika 1977;64(2):191–199",checked:false,link:"https://academic.oup.com/biomet",
 why:"Constant nominal significance level at every interim look. Easier to stop early, at the price of a larger maximum sample size. Details not machine-verified in this build."},
obrien1979:{a:"O'Brien PC, Fleming TR",y:1979,t:"A multiple testing procedure for clinical trials",s:"Biometrics 1979;35(3):549–556",checked:false,link:"https://pubmed.ncbi.nlm.nih.gov/497341/",
 why:"Very stringent early, close to nominal at the end. The usual default in confirmatory trials because the maximum sample size is barely inflated. Details not machine-verified in this build."},
landemets1983:{a:"Lan KKG, DeMets DL",y:1983,t:"Discrete sequential boundaries for clinical trials",s:"Biometrika 1983;70(3):659–663",checked:false,link:"https://academic.oup.com/biomet",
 why:"The alpha-spending function, which frees you from fixing the number and timing of interim looks in advance. Details not machine-verified in this build."},
royston2003:{a:"Royston P, Parmar MKB, Qian W",y:2003,t:"Novel designs for multi-arm clinical trials with survival outcomes with an application in ovarian cancer",s:"Statistics in Medicine 2003;22(14):2239–2256",checked:false,link:"https://pubmed.ncbi.nlm.nih.gov/12854091/",
 why:"The multi-arm multi-stage (MAMS) design — several experimental arms against a shared control, with arms dropped at interim stages. The template for STAMPEDE and RECOVERY. Details not machine-verified in this build."},
murphy2005:{a:"Murphy SA",y:2005,t:"An experimental design for the development of adaptive treatment strategies",s:"Statistics in Medicine 2005;24(10):1455–1481",checked:false,link:"https://pubmed.ncbi.nlm.nih.gov/15586395/",
 why:"The SMART design: randomise, observe response, re-randomise non-responders. Built for sequencing decisions rather than single comparisons. Details not machine-verified in this build."},
hemming2020plat:{a:"Angus DC, Alexander BM, Berry S, et al.",y:2019,t:"Adaptive platform trials: definition, design, conduct and reporting considerations",s:"Nature Reviews Drug Discovery 2019;18(10):797–807",checked:false,link:"https://pubmed.ncbi.nlm.nih.gov/31462747/",
 why:"The consensus statement on platform trials — a perpetual protocol with a shared control, arms entering and leaving. Details not machine-verified in this build."},
hsieh1998:{a:"Hsieh FY, Bloch DA, Larsen MD",y:1998,t:"A simple method of sample size calculation for linear and logistic regression",s:"Statistics in Medicine 1998;17(14):1623–1634",checked:true,link:"https://pubmed.ncbi.nlm.nih.gov/9699234/",
 why:"How to inflate for covariate adjustment: the variance inflation factor 1/(1 − R²)."},
hoenig2001:{a:"Hoenig JM, Heisey DM",y:2001,t:"The abuse of power: the pervasive fallacy of power calculations for data analysis",s:"The American Statistician 2001;55(1):19–24",checked:false,link:"",
 why:"Why observed power after the fact is uninformative. Cite this when a reviewer asks for the power of a null result. Details not machine-verified in this build."},

/* --- the case studies --- */
polio1955:{a:"Francis T Jr, Korns RF, Voight RB, et al.",y:1955,t:"An evaluation of the 1954 poliomyelitis vaccine trials: summary report",s:"American Journal of Public Health 1955;45(5 Pt 2):1–63",checked:false,link:"https://ajph.aphapublications.org/",
 why:"The Salk field trial: roughly 1.8 million children, a randomised placebo-controlled core and a non-randomised observed-control arm running in parallel. The comparison between the two arms is the best natural demonstration ever run of what randomisation buys. Details not machine-verified in this build."},
isis2:{a:"ISIS-2 (Second International Study of Infant Survival) Collaborative Group",y:1988,t:"Randomised trial of intravenous streptokinase, oral aspirin, both, or neither among 17,187 cases of suspected acute myocardial infarction",s:"The Lancet 1988;332(8607):349–360",checked:false,link:"https://pubmed.ncbi.nlm.nih.gov/2899772/",
 why:"The mega-trial that established aspirin in myocardial infarction, and the origin of the famous astrological-sign subgroup analysis the authors included deliberately to discredit subgroup fishing. A 2×2 factorial. Details not machine-verified in this build."},
cast1991:{a:"Echt DS, Liebson PR, Mitchell LB, et al.",y:1991,t:"Mortality and morbidity in patients receiving encainide, flecainide, or placebo. The Cardiac Arrhythmia Suppression Trial",s:"New England Journal of Medicine 1991;324(12):781–788",checked:true,link:"https://pubmed.ncbi.nlm.nih.gov/1900101/",
 why:"The trial that found harm where every mechanism predicted benefit: suppressing ventricular ectopy after myocardial infarction increased mortality. Encainide and flecainide were stopped early for excess deaths. The permanent argument against surrogate endpoints."},
ardsnet2000:{a:"The Acute Respiratory Distress Syndrome Network",y:2000,t:"Ventilation with lower tidal volumes as compared with traditional tidal volumes for acute lung injury and the acute respiratory distress syndrome",s:"New England Journal of Medicine 2000;342(18):1301–1308",checked:true,link:"https://pubmed.ncbi.nlm.nih.gov/10793162/",
 why:"A device-and-technique trial rather than a drug trial: the intervention is a ventilator setting, delivered by a protocol. Stopped early at interim for benefit. The model for how to randomise a piece of equipment's use rather than the equipment itself."},
cutts2005:{a:"Cutts FT, Zaman SMA, Enwere G, et al.; Gambian Pneumococcal Vaccine Trial Group",y:2005,t:"Efficacy of nine-valent pneumococcal conjugate vaccine against pneumonia and invasive pneumococcal disease in The Gambia: randomised, double-blind, placebo-controlled trial",s:"The Lancet 2005;365(9465):1139–1146",checked:true,link:"https://pubmed.ncbi.nlm.nih.gov/15794968/",
 why:"A bacterial vaccine trial at scale: 8,718 children vaccinated and 8,719 given placebo, powered on radiological pneumonia. Efficacy 77% against vaccine-serotype invasive disease, 15% against all-cause admission and 16% against mortality — the last two being the numbers that changed policy, and the reason the trial had to be enormous."},
